:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#18263c;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101e3d,#256a93);padding:20px}.loginbox{background:white;padding:30px;border-radius:18px;width:min(460px,95vw)}.muted{color:#69778d}.small{font-size:12px}.field{display:grid;gap:6px;margin:12px 0}input,select,textarea{border:1px solid #d6deea;border-radius:9px;padding:11px;background:white;width:100%;color:#18263c}textarea{min-height:140px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#235dd1;color:white;font-weight:650}.btn.secondary{background:#e8eef8;color:#24436b}.btn.danger{background:#fce8e9;color:#b42332}.btn.green{background:#0b927f}.btn.tiny{padding:7px 10px;font-size:12px}.shell{display:flex;min-height:100vh}.side{width:250px;background:#142442;color:#e8f0ff;padding:22px 14px;flex-shrink:0}.brand{font-size:19px;font-weight:800;margin:8px 10px 30px}.nav{display:block;border:0;background:none;color:#b6c6df;padding:13px 15px;width:100%;text-align:left;border-radius:10px;margin-bottom:5px}.nav.active,.nav:hover{background:#284366;color:white}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e3e8f1;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:10px}.content{padding:26px;max-width:1350px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.head h1{margin:0 0 5px;font-size:27px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.card{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:20px;margin:12px 0}.metric{font-size:32px;font-weight:850;color:#183b7b;margin:8px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf1f8;color:#48607f;font-size:12px;font-weight:700}.sectioncards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:20px 0}.sectioncard{background:white;border:1px solid #dce4f1;border-radius:15px;padding:17px;text-align:left}.sectioncard strong{display:block;margin:12px 0 5px}.sectioncard span{color:#61758f;font-size:13px}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;background:#f3f6fb;color:#506581;font-size:12px}.tbl td,.tbl th{padding:12px;border-bottom:1px solid #e8edf5;vertical-align:middle}.tbl .btn{margin:2px}.notice{background:#eaf4ff;border-left:4px solid #3384e4;padding:13px;border-radius:7px;margin:12px 0}.question{border:1px solid #e2e8f2;border-radius:12px;padding:15px;margin:12px 0}.question label{display:block;margin:9px 0}.question input[type=radio]{width:auto}.modalbg{position:fixed;inset:0;background:#0b1b36a6;display:grid;place-items:center;padding:18px;z-index:9}.modal{width:min(750px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:24px}.empty{text-align:center;padding:25px;color:#69778d}.error{color:#b42332}.foot{font-size:12px;color:#708098;margin-top:20px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.sectioncards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{display:block}.side{width:100%;padding:10px}.brand{margin:6px}.side nav{display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}.top{padding:14px}.content{padding:15px}.sectioncards{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.sectioncards{grid-template-columns:1fr}}

const firebaseConfig={apiKey:'AIzaSyA-Gn95UX2IxKzuwL2ZMSq3oE4BoyBkzDU',authDomain:'ashraf-ielts-practice.firebaseapp.com',projectId:'ashraf-ielts-practice',storageBucket:'ashraf-ielts-practice.firebasestorage.app',messagingSenderId:'433198266481',appId:'1:433198266481:web:e6f233c7bfb9b980cb43d0'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app),storage=getStorage(app);const CATS=['Listening','Reading','Writing Task 1','Writing Task 2','Speaking'];const CLASSES=['12 G','12 Adv'];const CLASS_PAGE={'12 G':'class12g','12 Adv':'class12adv'};const AUTO=c=>['Listening','Reading',...CLASSES].includes(c);const isClass=c=>CLASSES.includes(c);
let current=null,profile=null,page='dashboard',category='Listening',users=[],tests=[],submissions=[],busy=false;const root=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const byId=id=>tests.find(t=>t.id===id);const isAdmin=()=>profile?.role==='admin';const ownSub=id=>submissions.find(s=>s.testId===id&&s.userId===current.uid);const assigned=t=>t.assign?.includes('ALL')||t.assign?.includes(current.uid)||(profile.group&&t.assign?.includes('GROUP:'+profile.group));const eligible=t=>t.active&&assigned(t);const tag=s=>`<span class="tag">${esc(s)}</span>`;
// Legacy blank template documents remain untouched in Firestore but are not displayed.
const visibleTest=t=>Boolean(t.resourcePath||t.questions?.length||t.published||t.createdByInstructor);

function message(e){alert(e?.message||String(e))}function showModal(html){closeModal();let el=document.createElement('div');el.id='modal';el.className='modalbg';el.onclick=e=>{if(e.target===el)closeModal()};el.innerHTML=`<div class="modal">${html}</div>`;document.body.append(el)}function closeModal(){document.getElementById('modal')?.remove()}
function usernameEmail(username){const u=username.trim().toLowerCase();if(!/^[a-z0-9][a-z0-9._-]{2,29}$/.test(u))throw Error('Username must be 3–30 characters: letters, numbers, dots, underscores or hyphens.');return u+'@students.ashraf-ielts-practice.invalid';}
function login(){root.innerHTML=`<div class="login"><div class="loginbox"><h1>✦ Ashraf IELTS Practice</h1><p class="muted">IELTS Academic • Listening • Reading • Writing • Speaking</p><form id="loginForm"><label class="field">Username (students) or email (instructor)<input type="text" name="identifier" required autocomplete="username"></label><label class="field">Password<input type="password" name="password" required autocomplete="current-password"></label><p id="loginError" class="error"></p><button class="btn" style="width:100%">Sign in</button></form><p class="small muted">Students: enter the username and password given by your instructor. Instructor: use your Firebase email and password.</p></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const value=e.target.identifier.value.trim();const email=value.includes('@')?value:usernameEmail(value);await signInWithEmailAndPassword(auth,email,e.target.password.value)}catch(err){document.getElementById('loginError').textContent=err.message}}}
async function refresh(){if(!current)return;const [u,t,s]=await Promise.all([isAdmin()?getDocs(collection(fs,'users')):Promise.resolve(null),getDocs(collection(fs,'tests')),isAdmin()?getDocs(collection(fs,'submissions')):getDocs(query(collection(fs,'submissions'),where('userId','==',current.uid)))]);users=u?u.docs.map(d=>({id:d.id,...d.data()})):[];tests=t.docs.map(d=>({id:d.id,...d.data()}));submissions=s.docs.map(d=>({id:d.id,...d.data()}));}
function render(){if(!current||!profile)return login();let admin=isAdmin(),items=admin?[['dashboard','Overview'],['users','Trainees'],['tests','Test Library'],['class12g','12 G'],['class12adv','12 Adv'],['assignments','Assignments'],['grading','Marking & Scores'],['reports','Reports']]:[['dashboard','My Dashboard'],['tests','My Tests'],...CLASSES.filter(c=>tests.some(t=>t.cat===c&&visibleTest(t)&&(eligible(t)||ownSub(t.id)))).map(c=>[CLASS_PAGE[c],c]),['reports','My Results']];root.innerHTML=`<div class="shell ${admin?'teacher-theme':'student-theme'}"><aside class="side"><div class="brand">✦ Ashraf IELTS<br><span class="small muted">ACADEMIC PRACTICE</span></div><nav>${items.map(([p,n])=>`<button class="nav ${page===p?'active':''}" data-nav="${p}">${n}</button>`).join('')}</nav></aside><main class="main"><header class="top"><div><b>${admin?'Instructor Portal':'Student Portal'}</b> <span class="small muted">/ ${esc(({class12g:'12 G',class12adv:'12 Adv'})[page]||page)}</span></div><div class="row"><span class="small">${esc(profile.name||current.email)}</span><button id="signout" class="btn secondary tiny">Sign out</button></div></header><div class="content" id="content"></div></main></div>`;root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});document.getElementById('signout').onclick=()=>signOut(auth);({dashboard,users:usersPage,tests:()=>testsPage(),class12g:()=>testsPage('12 G'),class12adv:()=>testsPage('12 Adv'),assignments:assignmentsPage,grading:gradingPage,reports:reportsPage}[page]||dashboard)()}
function dashboard(){let ss=isAdmin()?submissions:submissions.filter(s=>s.userId===current.uid),stats=isAdmin()?[[users.filter(u=>u.role==='student').length,'Total trainees'],[tests.filter(t=>t.active).length,'Active tests'],[ss.length,'Submissions'],[ss.filter(s=>s.status==='Pending grading').length,'To be graded']]:[[tests.filter(eligible).length,'Available tests'],[ss.filter(s=>s.status==='Completed').length,'Completed'],[ss.filter(s=>s.status==='Pending grading').length,'Awaiting grading'],[CATS.length,'IELTS sections']];document.getElementById('content').innerHTML=`<div class="head"><div><h1>Welcome, ${esc(profile.name)}</h1><p class="muted">${isAdmin()?'Manage your IELTS Academic training in one place.':'Your IELTS Academic learning journey.'}</p></div>${isAdmin()?'<button class="btn" id="addTrainee">+ Add trainee</button>':''}</div><div class="grid">${stats.map(([n,l])=>`<div class="card"><div class="muted small">${l}</div><div class="metric">${n}</div></div>`).join('')}</div><h2>Practice sections</h2><div class="sectioncards">${CATS.map((c,i)=>`<button class="sectioncard" data-cat="${esc(c)}"><div style="font-size:27px">${['🎧','📖','📝','✍️','🎥'][i]}</div><strong>${c}</strong><span>${tests.filter(t=>t.cat===c&&visibleTest(t)&&(isAdmin()||eligible(t)||ownSub(t.id))).length} tests</span></button>`).join('')}</div>${(()=>{let cls=CLASSES.filter(c=>isAdmin()||tests.some(t=>t.cat===c&&visibleTest(t)&&(eligible(t)||ownSub(t.id))));return cls.length?`<h2>School classes</h2><div class="sectioncards" style="grid-template-columns:repeat(${Math.max(2,cls.length)},minmax(0,1fr))">${cls.map(c=>`<button class="sectioncard" data-class="${esc(c)}"><div style="font-size:27px">🎓</div><strong>${esc(c)}</strong><span>${tests.filter(t=>t.cat===c&&visibleTest(t)&&(isAdmin()||eligible(t)||ownSub(t.id))).length} exams${isAdmin()?' • '+tests.filter(t=>t.cat===c&&visibleTest(t)&&t.active).length+' active':''}</span></button>`).join('')}</div>`:''})()}<div class="card"><h3>Recent submissions</h3>${tableSub(ss.slice(-5).reverse())}</div><div class="foot">Connected to Firebase • Accounts and results are shared across devices.</div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;page='tests';render()});document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{page=CLASS_PAGE[b.dataset.class];render()});if(isAdmin())document.getElementById('addTrainee').onclick=()=>openUser();wireGrades()}
function tableSub(arr){return arr.length?`<div class="tablewrap"><table class="tbl"><tr><th>Trainee</th><th>Test</th><th>Submitted</th><th>Status</th><th>Score</th>${isAdmin()?'<th>Action</th>':''}</tr>${arr.map(s=>`<tr><td>${esc(users.find(u=>u.id===s.userId)?.name|| (s.userId===current.uid?profile.name:s.userId))}</td><td>${esc(byId(s.testId)?.title||s.testId)}</td><td>${esc((s.date||'').slice(0,10))}</td><td>${tag(s.status)}</td><td>${s.score==null?'—':esc(s.score)+'/'+esc(s.maxScore)} ${s.band!=null?'(Band '+esc(s.band)+')':''}</td>${isAdmin()?`<td><button class="btn tiny secondary" data-grade="${s.id}">Grade / Review</button></td>`:''}</tr>`).join('')}</table></div>`:'<div class="empty">No submissions yet.</div>'}
function wireGrades(){document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.grade))}
function usersPage(){if(!isAdmin())return;document.getElementById('content').innerHTML=`<div class="head"><h1>Trainee management</h1><button id="newUser" class="btn">+ Create trainee</button></div><div class="notice">Create a username and password for each trainee. Firebase securely handles passwords through an internal account. Disabling blocks app access; removing access does not delete the Firebase Authentication identity. Disabling here blocks app access; deleting a trainee here archives access in this app but does not delete the Firebase Authentication identity.</div><div class="card tablewrap"><table class="tbl"><tr><th>Name</th><th>Username</th><th>Group</th><th>Access</th><th>Action</th></tr>${users.filter(u=>u.role==='student').map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username||u.email||"—")}</td><td>${esc(u.group||'—')}</td><td>${tag(u.active?'Active':'Disabled')}</td><td><button class="btn tiny secondary" data-toggle="${u.id}">${u.active?'Disable':'Enable'}</button><button class="btn tiny danger" data-remove="${u.id}">Remove access</button></td></tr>`).join('')}</table></div>`;document.getElementById('newUser').onclick=openUser;document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{let u=users.find(x=>x.id===b.dataset.toggle);try{await updateDoc(doc(fs,'users',u.id),{active:!u.active});await refresh();render()}catch(e){message(e)}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this trainee’s app access? Their Firebase Authentication account will remain until manually deleted in Firebase Console.'))return;try{await deleteDoc(doc(fs,'users',b.dataset.remove));await refresh();render()}catch(e){message(e)}})}
function openUser(){showModal(`<h2>Create trainee</h2><p class="muted">A separate Firebase Authentication account will be created without signing you out.</p><form id="newUserForm"><label class="field">Full name<input name="name" required></label><label class="field">Username<input name="username" type="text" minlength="3" maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,29}" required autocomplete="off"></label><label class="field">Password (at least 6 characters)<input name="password" type="password" minlength="6" required></label><label class="field">Group<input name="group"></label><div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button class="btn">Create</button></div></form>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('newUserForm').onsubmit=async e=>{e.preventDefault();let f=e.target,secondary=null;try{let {initializeApp:initializeSecondary,deleteApp}=await import('https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js');secondary=initializeSecondary(firebaseConfig,'trainee-creator-'+Date.now());let secondaryAuth=getAuth(secondary);let cred=await createUserWithEmailAndPassword(secondaryAuth,usernameEmail(f.username.value),f.password.value);await setDoc(doc(fs,'users',cred.user.uid),{name:f.name.value.trim(),email:usernameEmail(f.username.value),username:f.username.value.trim().toLowerCase(),group:f.group.value.trim(),role:'student',active:true});await signOut(secondaryAuth);await deleteApp(secondary);closeModal();await refresh();render();alert('Trainee created. Give them their username and password privately.')}catch(err){message(err);if(secondary){try{await signOut(getAuth(secondary))}catch{}}}}}
function testsPage(fixed){let admin=isAdmin();if(!fixed&&isClass(category))category='Listening';let cat=fixed||category;let listed=tests.filter(t=>t.cat===cat&&visibleTest(t)&&(admin||eligible(t)||ownSub(t.id))).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')||String(a.title).localeCompare(String(b.title)));document.getElementById('content').innerHTML=`<div class="head"><div><h1>${fixed?esc(fixed)+(admin?' — Exams':' — My Exams'):admin?'Test Library':'My Tests'}</h1>${fixed&&admin?'<p class="muted" style="margin:0">Upload exams for this class, then activate them and assign them to students or groups.</p>':''}</div>${admin?`<button class="btn" id="addTest">+ Upload New ${fixed?'Exam':'Test'}</button>`:''}</div><div class="card">${fixed?'':`<label class="field">IELTS section<select id="category">${CATS.map(c=>`<option ${c===category?'selected':''}>${c}</option>`).join('')}</select></label>`}${listed.length?listed.map(t=>{let s=ownSub(t.id),ok=eligible(t);return `<div class="row spread" style="padding:14px 0;border-bottom:1px solid #e1e7f0"><div><b>${esc(t.title)}</b><div class="small muted">${tag(t.active?'Active':'Inactive')} ${admin?(t.resourceName?' • Uploaded: '+esc(t.resourceName):' • No file attached')+' • '+esc(t.assign?.length||0)+' targets':s?tag(s.status):ok?'Available':'Not assigned'} ${s&&s.score!=null?' • '+esc(s.score)+'/'+esc(s.maxScore):''}</div></div><div class="row">${admin?`<button class="btn secondary tiny" data-edit="${t.id}">Edit / Upload</button>${t.resourcePath?`<button class="btn secondary tiny" data-preview="${t.id}">Preview Test</button>`:``}<button class="btn secondary tiny" data-assign="${t.id}">Assign</button><button class="btn tiny ${t.active?'danger':'green'}" data-toggle-test="${t.id}">${t.active?'Deactivate':'Activate'}</button><button class="btn danger tiny" data-delete-test="${t.id}">Delete</button>`:s?`<button class="btn tiny secondary" data-result="${t.id}">View result</button>${s.reviewState&&t.resourcePath?`<button class="btn tiny secondary" data-review="${t.id}">Review Answers</button>`:``}`:ok?`<button class="btn tiny" data-start="${t.id}">Start test</button>`:''}</div></div>`}).join(''):`<div class="empty">${admin?(fixed?'No exams uploaded for '+esc(fixed)+' yet. Click Upload New Exam.':'No tests uploaded in this section yet. Click Upload New Test.'):'No assigned exams available here yet.'}</div>`}</div>`;if(!fixed)document.getElementById('category').onchange=e=>{category=e.target.value;testsPage()};if(admin)document.getElementById('addTest').onclick=()=>createTest(cat);wireTestButtons()}
async function createTest(cat=category){showModal(`<h2>Upload New ${esc(cat)} ${isClass(cat)?'Exam':'Test'}</h2><p class="muted">Give the test your own name. There is no test-number limit.</p><form id="newTestForm"><label class="field">Test name<input name="title" required placeholder="${isClass(cat)?'e.g. '+esc(cat)+' – Unit 3 Quiz':'e.g. Cambridge IELTS 18 – Listening Test 1'}"></label><label class="field">HTML exam or resource<input type="file" name="resource" accept=".html,.htm,.pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.mp3,.wav,.m4a" required></label><label class="field">Duration (minutes)<input type="number" name="duration" min="1" value="60" required></label><p class="small muted">New tests start deactivated and unassigned. Listening/Reading HTML must include a compatible result connector for automatic scoring. Speaking HTML tests record the student's answers and send them to you for marking.</p><div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button class="btn" id="createTestSubmit">Upload Test</button></div></form>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('newTestForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;let f=e.target,btn=document.getElementById('createTestSubmit');btn.disabled=true;btn.textContent='Uploading…';try{let title=f.elements.namedItem('title').value.trim(),file=f.elements.namedItem('resource').files[0],duration=Number(f.elements.namedItem('duration').value);if(!title||!file)throw Error('Enter a test name and choose a file.');if(file.size>25*1024*1024)throw Error('File exceeds 25 MB.');let id=doc(collection(fs,'tests')).id,path=`resources/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;await uploadBytes(ref(storage,path),file,{contentType:/\.html?$/i.test(file.name)?'text/html':(file.type||'application/octet-stream')});btn.textContent='Saving test details…';let resourceURL='';try{resourceURL=await getDownloadURL(ref(storage,path))}catch(e){console.warn('Could not obtain download URL automatically',e)}await setDoc(doc(fs,'tests',id),{cat,title,duration,active:false,assign:[],questions:[],prompt:'',resourcePath:path,resourceName:file.name,resourceURL,createdAt:new Date().toISOString(),createdByInstructor:true});closeModal();await refresh();render();alert('Test uploaded and saved successfully: '+file.name+'\nThe new test is deactivated until you activate and assign it.')}catch(err){message(err);btn.disabled=false;btn.textContent='Upload Test'}finally{busy=false}}}

ase paste a Firebase Storage download URL.');if(t.cat==='Listening')data.audio=field("audio").value.trim();if(objective){let q=JSON.parse(field("questions").value.trim()||"[]");if(!Array.isArray(q)||!q.every(x=>typeof x.q==='string'&&Array.isArray(x.options)&&x.options.length===4&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4))throw Error('Invalid MCQ JSON');data.questions=q}let file=field("resource").files[0];if(file){if(file.size>25*1024*1024)throw Error('File exceeds 25 MB limit');let path=`resources/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;try{await uploadBytes(ref(storage,path),file,{contentType:/\.html?$/i.test(file.name)?'text/html':(file.type||'application/octet-stream')});}catch(uploadErr){throw Error('File upload failed: '+(uploadErr?.message||uploadErr)+'. Check Firebase Storage is enabled and its security rules allow admin uploads.')}data.resourcePath=path;data.resourceName=file.name;try{data.resourceURL=await getDownloadURL(ref(storage,path))}catch(e){console.warn('Download URL unavailable; can be added in Edit / Upload',e);data.resourceURL=''}}if(!data.title)throw Error('Enter a test title.');await updateDoc(doc(fs,'tests',id),data);closeModal();await refresh();render();alert(file?'Test saved successfully. Uploaded file: '+file.name:'Test changes saved successfully. '+(t.resourceName?'Attached file: '+t.resourceName:'No file attached.'))}catch(err){message(err)}}}

rInterval(timer);submitTest(id,true)}},1000);document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();submitTest(id,false)}}

async function submitTest(id,expired){if(busy)return;busy=true;let t=byId(id),obj=['Listening','Reading'].includes(t.cat),f=document.getElementById('answerForm');if(!f){busy=false;return}try{let data={testId:id,userId:current.uid,date:new Date().toISOString(),status:obj?'Completed':'Pending grading',score:null,maxScore:null,band:null,feedback:'',response:'',answers:[]};if(obj){let fd=new FormData(f);if(!expired&&t.questions.some((_,i)=>!fd.has('q'+i)))throw Error('Answer all questions before submitting.');data.answers=t.questions.map((_,i)=>fd.has('q'+i)?Number(fd.get('q'+i)):-1);data.score=t.questions.filter((q,i)=>q.answer===data.answers[i]).length;data.maxScore=t.questions.length}else if(t.cat==='Speaking'){let file=f.video.files[0];if(!file)throw Error('Select a video first.');if(file.size>25*1024*1024)throw Error('Video exceeds 25 MB.');let path=`speaking/${current.uid}/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;await uploadBytes(ref(storage,path),file,{contentType:file.type||'video/mp4'});data.videoPath=path;data.response=file.name}else data.response=f.response.value;await setDoc(doc(fs,'submissions',`${current.uid}_${id}`),data);clearInterval(timer);await refresh();page='tests';render();alert('Submitted successfully.')}catch(e){message(e)}finally{busy=false}}

function gradeSpeaking(s,t,u){const opts=v=>Array.from({length:19},(_,i)=>i/2).map(n=>`<option value="${n}" ${v===n?'selected':''}>${n.toFixed(1)}</option>`).join('');const c=s.criteria||{};

<label class="field">Overall band (average of the four criteria, rounded to 0.5)<select name="band">${opts(s.band)}</select></label><label class="field">Feedback for the student<textarea name="feedback" style="min-height:140px" placeholder="Strengths, areas to improve, and comments for each part…">${esc(s.feedback||'')}</textarea></label><div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Close</button><button class="btn">Save assessment</button></div></form>`);
document.getElementById('cancelModal').onclick=closeModal;loadRecordings();const f=document.getElementById('gradeForm');
f.onchange=e=>{if(CRIT.some(([k])=>k===e.target.name)){let cr=Object.fromEntries(CRIT.map(([k])=>[k,f[k].value===''?NaN:Number(f[k].value)]));let o=overallBand(cr);if(o!=null)f.band.value=String(o)}};
f.onsubmit=async e=>{e.preventDefault();try{let band=Number(f.band.value),criteria={};CRIT.forEach(([k])=>{if(f[k].value!=='')criteria[k]=Number(f[k].value)});await updateDoc(doc(fs,'submissions',s.id),{band,score:band,maxScore:9,criteria,feedback:f.feedback.value,status:'Completed'});closeModal();await refresh();render();alert('Assessment saved. The student can now see the band and feedback.')}catch(err){message(err)}}}

// HTML exam bridge. Each HTML exam must implement the ASHRAF_IELTS_V1 protocol.
let examWindow=null,examMode=null,examTest=null,examReview=null,examNonce=0;
const HTML_CHANNEL='ASHRAF_IELTS_V1';
async function previewHtml(id){let t=byId(id);if(!t?.resourcePath)return alert('No resource attached.');if(!/\.html?$/i.test(t.resourceName||''))return openResource(t.resourcePath);await launchHtmlTest(t,'preview')}
async function reviewHtml(id){let t=byId(id),s=ownSub(id);if(!s?.reviewState)return alert('No saved answer review for this test.');await launchHtmlTest(t,'review',s.reviewState)}
async function launchHtmlTest(t,mode,reviewState=null){
 // Open synchronously during the click, before asynchronous Firebase operations.
 // Do not use noopener: the exam must message its opener to save results.
 const popup=window.open('','_blank');
 if(!popup){alert('Your browser blocked the exam tab. Allow pop-ups for this website, then click Start Test again.');return}
 try{
  popup.document.title='Opening IELTS examination';
  popup.document.body.innerHTML='<p style="font:20px sans-serif;padding:32px">Opening IELTS examination…</p>';
  if(!t.resourcePath)throw Error('No HTML file attached.');
  let url=t.resourceURL||'';
  if(!url){try{url=await getDownloadURL(ref(storage,t.resourcePath))}catch(e){throw Error('Could not obtain the exam link. Instructor: enter its Firebase download URL under Edit / Upload. '+(e.message||e))}}
  if(!/^https:\/\/firebasestorage\.googleapis\.com\//i.test(url))throw Error('Invalid Firebase Storage file URL.');
  clearInterval(timer);
  examWindow=popup;examMode=mode;examTest=t;examReview=reviewState;const nonce=++examNonce;
  // A separate tab avoids iframe focus/fullscreen conflicts.
  page='html-exam';render();
  document.getElementById('content').innerHTML=`<div class="head"><h1>${esc(t.title)} — ${mode==='review'?'Answer Review':mode==='preview'?'Instructor Preview':'Exam'}</h1><button class="btn secondary" id="backToTests">Back to tests</button></div><div class="notice">The examination opened in a separate tab. Keep this IELTS Student Portal tab open until your result is saved. ${mode==='take'?'Submit Final Result inside the examination, then wait for the saved confirmation.':''}</div><button class="btn" id="returnToExam">Return to examination tab</button>`;
  document.getElementById('returnToExam').onclick=()=>{if(!popup.closed)popup.focus();else alert('The examination tab is closed. Return to My Tests to reopen it.')};
  document.getElementById('backToTests').onclick=()=>{page='tests';render()};
  if(mode==='review')popup.addEventListener('load',()=>{if(nonce===examNonce&&!popup.closed)popup.postMessage({channel:HTML_CHANNEL,type:'review',reviewState},'https://firebasestorage.googleapis.com')});
  popup.location.replace(url);
 }catch(e){try{popup.close()}catch(_){}message(e);page='tests';render()}
}

// ---- Speaking tests: recordings arrive from the exam tab as audio Blobs ----
async function saveSpeaking(event){
 const src=event.source,org=event.origin,reply=m=>{try{src.postMessage({channel:HTML_CHANNEL,...m},org)}catch(_){}};
 const t=examTest,d=event.data;
 if(examMode!=='take'||!t||!current)return reply({type:'error',message:'Preview mode: recordings are not saved.'});
 if(isAdmin())return reply({type:'error',message:'Instructor preview: recordings are not saved. Sign in as a trainee to submit.'});
 if(!(t.cat==='Speaking'||isClass(t.cat)))return reply({type:'error',message:'This test is not a speaking test.'});
 if(!eligible(t))return reply({type:'error',message:'This test is not active or not assigned to you.',final:true});
 if(ownSub(t.id))return reply({type:'error',message:'You have already submitted this test.',final:true});
 const recs=Array.isArray(d.recordings)?d.recordings:[];
 if(!recs.length||recs.length>40)return reply({type:'error',message:'No recordings received.'});
 for(const r of recs){if(!(r.blob instanceof Blob)||!r.blob.size||r.blob.size>15*1024*1024||!/^(audio|video)\//.test(r.blob.type||'audio/webm'))return reply({type:'error',message:'A recording is empty, too large (over 15 MB) or not audio.'})}
 if(busy)return;busy=true;
 try{
  const stamp=Date.now(),out=[];
  for(let i=0;i<recs.length;i++){
   const r=recs[i],type=r.blob.type||'audio/webm',ext=/mp4|m4a|aac/.test(type)?'m4a':/ogg/.test(type)?'ogg':'webm';
   const safe=String(r.id||('q'+(i+1))).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,20)||('q'+(i+1));
   const path=`speaking/${current.uid}/${t.id}/${stamp}-${safe}.${ext}`;
   reply({type:'progress',done:i,total:recs.length});
   await uploadBytes(ref(storage,path),r.blob,{contentType:type});
   out.push({id:safe,part:Number(r.part)||0,topic:String(r.topic||'').slice(0,120),question:String(r.question||'').slice(0,400),seconds:Math.round((Number(r.seconds)||0)*10)/10,path});
   reply({type:'progress',done:i+1,total:recs.length});
  }
  const data={testId:t.id,userId:current.uid,date:new Date().toISOString(),status:'Pending grading',score:null,maxScore:null,band:null,feedback:'',response:`Speaking test • ${out.length} recordings`,answers:[],reviewState:null,source:'html-speaking',recordings:out,notes:String(d.notes||'').slice(0,3000)};
  await setDoc(doc(fs,'submissions',`${current.uid}_${t.id}`),data);
  reply({type:'saved'});await refresh();
  if(page==='html-exam'){page='tests';render()}
 }catch(e){let m=e.message||String(e);if(e.code==='storage/unauthorized')m='Firebase Storage refused the upload. The instructor needs to publish the latest storage.rules.';else if(e.code==='permission-denied')m='Firestore refused the save. Check that this test is active and assigned to you and that the latest firestore.rules are published.';reply({type:'error',message:m});message(e)}
 finally{busy=false}
}
const CRIT=[['fc','Fluency & Coherence'],['lr','Lexical Resource'],['gra','Grammatical Range & Accuracy'],['pr','Pronunciation']];
const overallBand=c=>{let v=CRIT.map(([k])=>Number(c?.[k])).filter(Number.isFinite);return v.length===4?Math.round(v.reduce((a,b)=>a+b,0)/4*2)/2:null};
function recordingsHtml(s){const parts=[1,2,3];return parts.map(p=>{let rs=(s.recordings||[]).filter(r=>r.part===p);if(!rs.length)return '';return `<h3 style="margin:14px 0 6px">Part ${p}</h3>${rs.map(r=>`<div style="padding:8px 0;border-bottom:1px solid #e1e7f0"><div class="small"><b>${esc(r.question)}</b> <span class="muted">(${esc(r.seconds)}s)</span></div><audio controls preload="none" data-rec="${esc(r.path)}" style="width:100%;height:38px;margin-top:4px"></audio></div>`).join('')}${p===2&&s.notes?`<div class="small muted" style="white-space:pre-wrap;margin-top:6px"><b>Student notes:</b> ${esc(s.notes)}</div>`:''}`}).join('')}
async function loadRecordings(){for(const a of document.querySelectorAll('audio[data-rec]')){try{a.src=await getDownloadURL(ref(storage,a.dataset.rec))}catch(e){a.insertAdjacentHTML('afterend','<div class="small error">Could not load this recording: '+esc(e.code||e.message)+'</div>')}}}
function critHtml(s){return s.criteria?`<div class="small" style="margin:8px 0">${CRIT.map(([k,l])=>`${l}: <b>${esc(s.criteria[k]??'–')}</b>`).join(' • ')}</div>`:''}
window.addEventListener('message',async event=>{
 if(event.data?.channel!==HTML_CHANNEL||!examWindow||event.source!==examWindow||event.origin!=='https://firebasestorage.googleapis.com')return;
 if(event.data.type==='speaking_submit'){await saveSpeaking(event);return}
 if(event.data.type!=='submit')return;
 if(examMode!=='take'||!examTest||!current||isAdmin())return;
 const t=examTest,d=event.data,score=d.score,max=d.maxScore,band=d.band;
 if(!AUTO(t.cat)||!eligible(t)||ownSub(t.id))return;
 const bandOk=Number.isFinite(band)&&band>=1&&band<=9&&Math.round(band*2)===band*2;
 if(!Number.isInteger(score)||!Number.isInteger(max)||max<1||max>100||score<0||score>max||(!isClass(t.cat)&&!bandOk)){event.source.postMessage({channel:HTML_CHANNEL,type:'error',message:'Invalid score or IELTS band.'},event.origin);return}
 if(busy)return;busy=true;const source=event.source;
 try{
  const id=`${current.uid}_${t.id}`;
  // Firestore create-only rule prevents a second submission; do not read a missing document.
  const data={testId:t.id,userId:current.uid,date:new Date().toISOString(),status:'Completed',score,maxScore:max,band:bandOk?band:null,feedback:'',response:'HTML exam',answers:[],reviewState:d.reviewState?JSON.parse(JSON.stringify(d.reviewState)):null,source:'html-bridge'};
  await setDoc(doc(fs,'submissions',id),data);
  source.postMessage({channel:HTML_CHANNEL,type:'saved'},event.origin);
  await refresh();
 }catch(e){let m=e.message||String(e);if(e.code==='permission-denied')m='Firestore refused the save (permission-denied). Check that this test is ACTIVE and ASSIGNED to you, that you have not already submitted it, and that the instructor has published the latest firestore.rules.';source.postMessage({channel:HTML_CHANNEL,type:'error',message:m},event.origin);message(e)}finally{busy=false}
});

onAuthStateChanged(auth,async user=>{current=user;profile=null;if(!user){clearInterval(timer);login();return}try{let snap=await getDoc(doc(fs,'users',user.uid));if(!snap.exists()||!snap.data().active){root.innerHTML='<div class="login"><div class="loginbox"><h2>Account not authorized</h2><p>Ask your instructor to activate your account in the IELTS Firebase project.</p><button id="exit" class="btn">Sign out</button></div></div>';document.getElementById('exit').onclick=()=>signOut(auth);return}profile=snap.data();await refresh();page='dashboard';render()}catch(e){root.innerHTML=`<div class="login"><div class="loginbox"><h2>Firebase connection error</h2><p class="error">${esc(e.message)}</p><button id="exit" class="btn">Sign out</button></div></div>`;document.getElementById('exit').onclick=()=>signOut(auth)}});login();
</script></body></html>
