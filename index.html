function testsPage(){let admin=isAdmin();let listed=tests.filter(t=>t.cat===category&&visibleTest(t)&&(admin||eligible(t)||ownSub(t.id))).sort((a,b)=>{const x=Number.isFinite(a.displayOrder)?a.displayOrder:null,y=Number.isFinite(b.displayOrder)?b.displayOrder:null;if(x!==null||y!==null){if(x===null)return 1;if(y===null)return -1;if(x!==y)return x-y}return (a.createdAt||'').localeCompare(b.createdAt||'')||String(a.title).localeCompare(String(b.title))});document.getElementById('content').innerHTML=`<div class="head"><h1>${admin?'Test Library':'My Tests'}</h1>${admin?'<button class="btn" id="addTest">+ Upload New Test</button>':''}</div><div class="card"><label class="field">IELTS section<select id="category">${CATS.map(c=>`<option ${c===category?'selected':''}>${c}</option>`).join('')}</select></label>${listed.length?listed.map(t=>{let s=ownSub(t.id),ok=eligible(t);return `<div class="row spread" style="padding:14px 0;border-bottom:1px solid #e1e7f0"><div><b>${esc(t.title)}</b><div class="small muted">${tag(t.active?'Active':'Inactive')} ${admin?(t.resourceName?' • Uploaded: '+esc(t.resourceName):' • No file attached')+' • '+esc(t.assign?.length||0)+' targets':s?tag(s.status):ok?'Available':'Not assigned'} ${s&&s.score!=null?' • '+esc(s.score)+'/'+esc(s.maxScore):''}</div></div><div class="row">${admin?`<button class="btn order-btn tiny" data-move-up="${t.id}" ${listed.indexOf(t)===0?'disabled':''} title="Move up" aria-label="Move ${esc(t.title)} up">↑ Up</button><button class="btn order-btn tiny" data-move-down="${t.id}" ${listed.indexOf(t)===listed.length-1?'disabled':''} title="Move down" aria-label="Move ${esc(t.title)} down">↓ Down</button><button class="btn secondary tiny" data-edit="${t.id}">Edit / Upload</button>${t.resourcePath?`<button class="btn secondary tiny" data-preview="${t.id}">Preview Test</button>`:``}<button class="btn secondary tiny" data-assign="${t.id}">Assign</button><button class="btn tiny ${t.active?'danger':'green'}" data-toggle-test="${t.i async function createTest(){showModal(`<h2>Upload New ${esc(category)} Tests</h2><p class="muted">Select one or several files. Each file creates a separate test, initially inactive and unassigned.</p><form id="newTestForm"><label class="field">Test name (optional for multiple files)<input name="title" placeholder="For one file, enter a custom test name"></label><label class="field">HTML exams or resources — select multiple files<input type="file" name="resource" multiple accept=".html,.htm,.pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.mp3,.wav,.m4a" required></label><p class="small muted" id="fileSelectionStatus">Each file must be 100 MB or smaller.</p><label class="field">Duration (minutes)<input type="number" name="duration" min="1" value="60" required></label><p class="small muted">Listening/Reading HTML requires a compatible result connector for automatic scoring. Each new test starts deactivated and unassigned.</p><div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button class="btn" id="createTestSubmit">Upload Tests</button></div></form>`);document.getElementById('cancelModal').onclick=closeModal;const form=document.getElementById('newTestForm');form.elements.namedItem('resource').onchange=()=>{const files=Array.from(form.elements.namedItem('resource').files);document.getElementById('fileSelectionStatus').textContent=files.length?`${files.length} file(s) selected. Maximum 100 MB per file.`:'Each file must be 100 MB or smaller.'};form.onsubmit=async e=>{e.preventDefault();if(busy)return;let f=e.target,btn=document.getElementById('createTestSubmit'),files=Array.from(f.elements.namedItem('resource').files),customName=f.elements.namedItem('title').value.trim(),duration=Number(f.elements.namedItem('duration').value);if(!files.length)return alert('Choose at least one file.');const tooLarge=files.filter(file=>file.size>100*1024*1024);if(tooLarge.length)return alert('These files exceed 100 MB: '+tooLarge.map(x=>x.name).join(', '));busy=true;btn.disabled=true;let uploaded=[],failed=[];try{for(let i=0;i<files.length;i++){let file=files[i];btn.textContent=`Uploading ${i+1} of ${files.length}…`;try{let id=doc(collection(fs,'tests')).id,path=`resources/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;await uploadBytes(ref(storage,path),file,{contentType:/\.html?$/i.test(file.name)?'text/html':(file.type||'application/octet-stream')});let resourceURL='';try{resourceURL=await getDownloadURL(ref(storage,path))}catch(err){console.warn('Could not obtain download URL automatically',err)}let fileTitle=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();let title=files.length===1?(customName||fileTitle):(customName?`${customName} ${i+1} - ${fileTitle}`:fileTitle);await setDoc(doc(fs,'tests',id),{cat:category,title,duration,active:false,assign:[],questions:[],prompt:'',resourcePath:path,resourceName:file.name,resourceURL,createdAt:new Date(Date.now()+i).toISOString(),createdByInstructor:true});uploaded.push(file.name)}catch(err){failed.push(`${file.name}: ${err.message||err}`)}}if(uploaded.length){closeModal();await refresh();testsPage()}alert(`${uploaded.length} of ${files.length} test(s) uploaded and saved. New tests are inactive and unassigned.`+(failed.length?'\nFailed:\n'+failed.join('\n'):''));if(!uploaded.length){btn.disabled=false;btn.textContent='Upload Tests'}}finally{busy=false}}}

async function moveTestInLibrary(id,direction){
 if(!isAdmin()||movingTestOrder)return;
 const ordered=tests.filter(t=>t.cat===category&&visibleTest(t)).sort((a,b)=>{const x=Number.isFinite(a.displayOrder)?a.displayOrder:null,y=Number.isFinite(b.displayOrder)?b.displayOrder:null;if(x!==null||y!==null){if(x===null)return 1;if(y===null)return -1;if(x!==y)return x-y}return (a.createdAt||'').localeCompare(b.createdAt||'')||String(a.title).localeCompare(String(b.title))});
 const i=ordered.findIndex(t=>t.id===id),j=i+direction;if(i<0||j<0||j>=ordered.length)return;
 movingTestOrder=true;
 document.querySelectorAll('[data-move-up],[data-move-down]').forEach(b=>b.disabled=true);
 try{
  [ordered[i],ordered[j]]=[ordered[j],ordered[i]];
  const batch=writeBatch(fs);
  ordered.forEach((t,k)=>batch.update(doc(fs,'tests',t.id),{displayOrder:k}));
  await batch.commit();
  ordered.forEach((t,k)=>t.displayOrder=k);
  testsPage();
 }catch(e){message(e);await refresh();testsPage()}
 finally{movingTestOrder=false}
}

function editTest(id){let t=byId(id),objective=['Listening','Reading'].includes(t.cat);showModal(`<h2>Edit ${esc(t.title)}</h2><form id="testEdit"><label class="field">Title<input name="title" value="${esc(t.title)}" required></label><label class="field">Duration (minutes)<input type="number" name="duration" min="1" value="${t.duration}" required></label><label class="field">Passage / instructions / writing prompt<textarea name="prompt">${esc(t.prompt)}</textarea></label>${t.cat==='Listening'?`<label class="field">Audio URL<input name="audio" value="${esc(t.audio||'')}"></label>`:''}<label class="field">Upload resource (PDF, Word, HTML, image, audio)<input type="file" name="resource" accept=".pdf,.doc,.docx,.html,.htm,.txt,.png,.jpg,.jpeg,.mp3,.wav,.m4a"></label>${t.resourcePath?'<p class="small">An online resource is already attached.</p>':''}<label class="field">Firebase file download URL (optional; use if Start Test cannot load)<input name="resourceURL" value="${esc(t.resourceURL||'')}" placeholder="https://firebasestorage.googleapis.com/v0/b/..."></label>${objective?`<label class="field">Optional platform MCQs as JSON (leave [] for HTML exams)<textarea name="questions" style="min-height:190px">${esc(JSON.stringify(t.questions||[],null,2))}</textarea></label><p class="small muted">Example: [{"q":"Question?","options":["A","B","C","D"],"answer":0}]</p>`:''}<div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button class="btn">Save test</button></div></form>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('testEdit').onsubmit=async e=>{e.preventDefault();let f=e.target;try{let field=name=>f.elements.namedItem(name);let data={title:field("title").value.trim(),duration:Number(field("duration").value),prompt:field("prompt").value,resourceURL:field("resourceURL").value.trim()};if(data.resourceURL&&!/^https:\/\/firebasestorage\.googleapis\.com\//i.test(data.resourceURL))throw Error('Please paste a Firebase Storage download URL.');if(t.cat==='Listening')data.audio=field("audio").value.trim();if(objective){let q=JSON.parse(field("questions").value.trim()||"[]");if(!Array.isArray(q)||!q.every(x=>typeof x.q==='string'&&Array.isArray(x.options)&&x.options.length===4&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4))throw Error('Invalid MCQ JSON');data.questions=q}let file=field("resource").files[0];if(file){if(file.size>100*1024*1024)throw Error('File exceeds 100 MB limit');let path=`resources/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;try{await uploadBytes(ref(storage,path),file,{contentType:/\.html?$/i.test(file.name)?'text/html':(file.type||'application/octet-stream')});}catch(uploadErr){throw Error('File upload failed: '+(uploadErr?.message||uploadErr)+'. Check Firebase Storage is enabled and its security rules allow admin uploads.')}data.resourcePath=path;data.resourceName=file.name;try{data.resourceURL=await getDownloadURL(ref(storage,path))}catch(e){console.warn('Download URL unavailable; can be added in Edit / Upload',e);data.resourceURL=''}}if(!data.title)throw Error('Enter a test title.');await updateDoc(doc(fs,'tests',id),data);closeModal();await refresh();render();alert(file?'Test saved successfully. Uploaded file: '+file.name:'Test changes saved successfully. '+(t.resourceName?'Attached file: '+t.resourceName:'No file attached.'))}catch(err){message(err)}}}
function assignTest(id){let t=byId(id),groups=[...new Set(users.map(u=>u.group).filter(Boolean))];showModal(`<h2>Assign ${esc(t.title)}</h2><form id="assignForm"><div style="max-height:340px;overflow:auto"><label><input type="checkbox" name="target" value="ALL" ${t.assign?.includes('ALL')?'checked':''} style="width:auto"> All trainees</label><hr>${groups.map(g=>`<p><label><input type="checkbox" name="target" value="${esc('GROUP:'+g)}" ${t.assign?.includes('GROUP:'+g)?'checked':''} style="width:auto"> Group: ${esc(g)}</label></p>`).join('')}${users.filter(u=>u.role==='student'&&u.active).map(u=>`<p><label><input type="checkbox" name="target" value="${u.id}" ${t.assign?.includes(u.id)?'checked':''} style="width:auto"> ${esc(u.name)} (${esc(u.username||u.email)})</label></p>`).join('')}</div><div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button class="btn">Save assignments</button></div></form>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('assignForm').onsubmit=async e=>{e.preventDefault();try{await updateDoc(doc(fs,'tests',id),{assign:[...e.target.querySelectorAll('[name=target]:checked')].map(x=>x.value)});closeModal();await refresh();render()}catch(err){message(err)}}}

let timer=null;async function takeTest(id){let t=byId(id);if(!eligible(t)||ownSub(id))return alert('This test is unavailable or already submitted.');if(t.cat==='Speaking'&&t.resourcePath&&!isSpeakingHtml(t)){await openResource(t.resourcePath);return;}if(!await ask('Start this test now? You can submit it only once.',{ok:'Start test'}))return;if(['Listening','Reading'].includes(t.cat)&&t.resourcePath&&/\.html?$/i.test(t.resourceName||'')){await launchHtmlTest(t,'take');return}if(isWritingTest(t)&&t.resourcePath&&/\.html?$/i.test(t.resourceName||'')){await launchWritingTest(t,'take');return}if(isSpeakingHtml(t)){await launchSpeakingTest(t,'take');return}let obj=['Listening','Reading'].includes(t.cat);page='test-taking';render();document.getElementById('content').innerHTML=`<div class="head"><h1>${esc(t.title)}</h1><b id="clock">${t.duration}:00</b></div><form class="card" id="answerForm"><div class="notice" style="white-space:pre-wrap">${esc(t.prompt||'No instructions supplied.')}</div>${t.resourcePath?`<button type="button" class="btn secondary" id="resourceLink">Open attached resource</button>`:''}${t.cat==='Listening'&&t.audio?`<audio controls src="${esc(t.audio)}" style="width:100%"></audio>`:''}${obj?(t.questions?.length?t.questions.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" style="width:auto" required> ${'ABCD'[j]}. ${esc(o)}</label>`).join('')}</div>`).join(''):'<div class="notice">This test has no MCQ questions yet.</div>'):t.cat==='Speaking'?`<h3>Upload your recorded speaking video</h3><input type="file" name="video" accept="video/*" capture="user" required><p class="small">Maximum 25 MB</p>`:`<h3>Your response</h3><textarea name="response" required placeholder="Write your IELTS response"></textarea>`}<button class="btn" ${obj&&!t.questions?.length?'disabled':''}>Submit test</button></form>`;if(t.resourcePath)document.getElementById('resourceLink').onclick=()=>openResource(t.resourcePath);let end=Date.now()+t.duration*60000;clearInterval(timer);timer=setInterval(()=>{let x=document.getElementById('clock');if(!x){clearInterval(timer);return}let n=Math.max(0,Math.ceil((end-Date.now())/1000));x.textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(n===0){clearInterval(timer);submitTest(id,true)}},1000);document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();submitTest(id,false)}}
async function openResource(path){try{window.open(await getDownloadURL(ref(storage,path)),'_blank','noopener')}catch(e){message(e)}}
async function submitTest(id,expired){if(busy)return;busy=true;let t=byId(id),obj=['Listening','Reading'].includes(t.cat),f=document.getElementById('answerForm');if(!f){busy=false;return}try{let data={testId:id,userId:current.uid,date:new Date().toISOString(),status:obj?'Completed':'Pending grading',score:null,maxScore:null,band:null,feedback:'',response:'',answers:[]};if(obj){let fd=new FormData(f);if(!expired&&t.questions.some((_,i)=>!fd.has('q'+i)))throw Error('Answer all questions before submitting.');data.answers=t.questions.map((_,i)=>fd.has('q'+i)?Number(fd.get('q'+i)):-1);data.score=t.questions.filter((q,i)=>q.answer===data.answers[i]).length;data.maxScore=t.questions.length}else if(t.cat==='Speaking'){let file=f.video.files[0];if(!file)throw Error('Select a video first.');if(file.size>25*1024*1024)throw Error('Video exceeds 25 MB.');let path=`speaking/${current.uid}/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;await uploadBytes(ref(storage,path),file,{contentType:file.type||'video/mp4'});data.videoPath=path;data.response=file.name}else data.response=f.response.value;await setDoc(doc(fs,'submissions',`${current.uid}_${id}`),data);clearInterval(timer);await refresh();page='tests';render();alert('Submitted successfully.')}catch(e){message(e)}finally{busy=false}}
function gradingPage(){document.getElementById('content').innerHTML=`<h1>Marking & Scores</h1><div class="card">${tableSub(submissions.slice().reverse())}</div>`;wireGrades()}
function grade(id){let s=submissions.find(x=>x.id===id),t=byId(s.testId),u=users.find(x=>x.id===s.userId);if(s.source==='html-writing')return gradeWriting(s,t,u);if(s.recordings)return gradeSpeaking(s,t,u);showModal(`<h2>Assess submission</h2><p><b>${esc(u?.name||s.userId)}</b> • ${esc(t?.title||s.testId)}</p>${s.videoPath?'<button class="btn secondary" id="watchVideo">▶ Watch video</button>':`<div class="card" style="white-space:pre-wrap;max-height:300px;overflow:auto">${esc(s.response||'Auto-marked MCQ')}</div>`}${s.score!=null?`<p>Auto score: ${s.score}/${s.maxScore}</p>`:''}<form id="gradeForm"><label class="field">Practice IELTS band (0–9)<select name="band">${Array.from({length:19},(_,i)=>i/2).map(n=>`<option value="${n}" ${s.band===n?'selected':''}>${n.toFixed(1)}</option>`).join('')}</select></label><label class="field">Feedback<textarea name="feedback">${esc(s.feedback||'')}</textarea></label><button class="btn">Save assessment</button></form>`);if(s.videoPath)document.getElementById('watchVideo').onclick=()=>openResource(s.videoPath);document.getElementById('gradeForm').onsubmit=async e=>{e.preventDefault();try{let band=Number(e.target.band.value),update={band,feedback:e.target.feedback.value,status:'Completed'};if(s.score==null){update.score=band;update.maxScore=9}await updateDoc(doc(fs,'submissions',id),update);closeModal();await refresh();render()}catch(err){message(err)}}}
function viewResult(id){let s=ownSub(id);showModal(`<h2>${esc(byId(id)?.title)}</h2><p>${tag(s.status)}</p><p><b>Score:</b> ${s.score==null?'Awaiting grading':esc(s.score)+'/'+esc(s.maxScore)}</p><p><b>Practice band:</b> ${s.band??'Not assigned'}</p><p style="white-space:pre-wrap"><b>Feedback:</b> ${esc(s.feedback||'No feedback yet')}</p>${writingResultHtml(s)}${speakingResultHtml(s)}<button class="btn secondary" id="closeResult" style="margin-top:12px">Close</button>`);document.getElementById('closeResult').onclick=closeModal;document.getElementById('myRecs')?.addEventListener('toggle',loadRecordings,{once:true})}
function reportsPage(){document.getElementById('content').innerHTML=`<div class="head"><h1>${isAdmin()?'Progress reports':'My results'}</h1>${isAdmin()?'<button class="btn" id="csv">Export CSV</button>':''}</div><div class="card">${tableSub(submissions.slice().reverse())}</div>`;wireGrades();if(isAdmin())document.getElementById('csv').onclick=()=>{let rows=[['Trainee','Username','Section','Test','Date','Status','Score','Maximum','Band','Feedback'],...submissions.map(s=>{let u=users.find(x=>x.id===s.userId),t=byId(s.testId);return [u?.name,u?.username||u?.email,t?.cat,t?.title,s.date,s.status,s.score,s.maxScore,s.band,s.feedback]})];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ashraf-ielts-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}}

// HTML exam bridge. Each HTML exam must implement the ASHRAF_IELTS_V1 protocol.
let examWindow=null,examMode=null,examTest=null,examReview=null,examNonce=0;
const HTML_CHANNEL='ASHRAF_IELTS_V1';
async function previewHtml(id){let t=byId(id);if(!t?.resourcePath)return alert('No resource attached.');if(!/\.html?$/i.test(t.resourceName||''))return openResource(t.resourcePath);if(isWritingTest(t))return launchWritingTest(t,'preview');if(isSpeakingHtml(t))return launchSpeakingTest(t,'preview');await launchHtmlTest(t,'preview')}
async function reviewHtml(id){let t=byId(id),s=ownSub(id);if(!s?.reviewState)return alert('No saved answer review for this test.');await launchReviewFrame(t,s.reviewState)}
// Answer review opens inside the portal page: the frame's load event tells us exactly when the exam is ready,
// so the saved answers are sent once and the exam shows them locked (works with existing exam files).
async function launchReviewFrame(t,reviewState){
 try{
  if(!t.resourcePath)throw Error('No HTML file attached.');
  let url=t.resourceURL||'';
  if(!url)url=await getDownloadURL(ref(storage,t.resourcePath));
  if(!/^https:\/\/firebasestorage\.googleapis\.com\//i.test(url))throw Error('Invalid Firebase Storage file URL.');
  clearInterval(timer);page='html-exam';render();
  document.getElementById('content').innerHTML=`<div class="head"><h1>${esc(t.title)} — Answer Review</h1><button class="btn secondary" id="backToTests">Back to tests</button></div><div style="position:relative"><iframe id="reviewFrame" src="${esc(url)}" allow="fullscreen; autoplay" allowfullscreen style="width:100%;height:80vh;border:1px solid #d6deea;border-radius:12px;background:#fff"></iframe><div id="reviewCover" style="position:absolute;inset:0;background:#f3f6fc;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:650;color:#24436b">Loading your answers…</div></div>`;
  const fr=document.getElementById('reviewFrame');
  examWindow=fr.contentWindow;examMode='review';examTest=t;examReview=reviewState;const nonce=++examNonce;
  fr.addEventListener('load',()=>{if(nonce!==examNonce)return;try{fr.contentWindow.postMessage({channel:HTML_CHANNEL,type:'review',reviewState},'https://firebasestorage.googleapis.com')}catch(_){}
   setTimeout(()=>document.getElementById('reviewCover')?.remove(),500)},{once:true});
  document.getElementById('backToTests').onclick=()=>{examWindow=null;page='tests';render()};
 }catch(e){message(e);page='tests';render()}
}
async function launchHtmlTest(t,mode,reviewState=null){
 // Open synchronously during the click, before asynchronous Firebase operations.
 // Do not use noopener: the exam must message its opener to save results.
 const popup=window.open('','_blank');
 if(!popup){alert('Your browser blocked the exam tab. Allow pop-ups for this website, then click Start Test again.');return}
 try{
  popup.document.title='Opening IELTS examination';
  popup.document.body.innerHTML='<p style="font:20px sans-serif;padding:32px">Opening IELTS examination…</p>';
  if(!t.resourcePath)throw Error('No HTML file attached.');
  let url=t.resourceURL||'';
  if(!url){try{url=await getDownloadURL(ref(storage,t.resourcePath))}catch(e){throw Error('Could not obtain the exam link. Instructor: enter its Firebase download URL under Edit / Upload. '+(e.message||e))}}
  if(!/^https:\/\/firebasestorage\.googleapis\.com\//i.test(url))throw Error('Invalid Firebase Storage file URL.');
  clearInterval(timer);
  examWindow=popup;examMode=mode;examTest=t;examReview=reviewState;const nonce=++examNonce;
  // A separate tab avoids iframe focus/fullscreen conflicts.
  page='html-exam';render();
  document.getElementById('content').innerHTML=`<div class="head"><h1>${esc(t.title)} — ${mode==='review'?'Answer Review':mode==='preview'?'Instructor Preview':'Exam'}</h1><button class="btn secondary" id="backToTests">Back to tests</button></div><div class="notice">The examination opened in a separate tab. Keep this IELTS Student Portal tab open until your result is saved. ${mode==='take'?'Submit Final Result inside the examination, then wait for the saved confirmation.':''}</div><button class="btn" id="returnToExam">Return to examination tab</button>`;
  document.getElementById('returnToExam').onclick=()=>{if(!popup.closed)popup.focus();else alert('The examination tab is closed. Return to My Tests to reopen it.')};
  document.getElementById('backToTests').onclick=()=>{page='tests';render()};
  if(mode==='review')popup.addEventListener('load',()=>{if(nonce===examNonce&&!popup.closed)popup.postMessage({channel:HTML_CHANNEL,type:'review',reviewState},'https://firebasestorage.googleapis.com')});
  popup.location.replace(url);
 }catch(e){try{popup.close()}catch(_){}message(e);page='tests';render()}
}
// ---- Writing tests (Task 1 / Task 2): the essay is written inside the portal page and sent here ----
const isWritingTest=t=>t&&/^Writing Task/.test(t.cat||'');
async function launchWritingTest(t,mode){
 try{
  if(!t.resourcePath)throw Error('No HTML file attached.');
  let url=t.resourceURL||'';
  if(!url)url=await getDownloadURL(ref(storage,t.resourcePath));
  if(!/^https:\/\/firebasestorage\.googleapis\.com\//i.test(url))throw Error('Invalid Firebase Storage file URL.');
  clearInterval(timer);page='html-exam';render();
  document.getElementById('content').innerHTML=`<div class="head"><h1>${esc(t.title)}${mode==='preview'?' — Instructor Preview':''}</h1><button class="btn secondary" id="backToTests">Leave test</button></div><div class="notice small" style="margin:0 0 10px">Do not leave this page until you see “Your essay has been submitted”.</div><iframe id="writeFrame" src="${esc(url)}" allow="fullscreen" allowfullscreen style="width:100%;height:80vh;border:1px solid #d6deea;border-radius:12px;background:#fff"></iframe>`;
  examWindow=document.getElementById('writeFrame').contentWindow;examMode=mode;examTest=t;examReview=null;++examNonce;
  document.getElementById('backToTests').onclick=async()=>{if(mode==='take'&&!ownSub(t.id)&&!await ask('Leave the writing test? Your essay stays saved in this browser, but it is not submitted yet.',{ok:'Leave test'}))return;examWindow=null;page='tests';render()};
 }catch(e){message(e);page='tests';render()}
}
async function saveWriting(event){
 const src=event.source,org=event.origin,reply=m=>{try{src.postMessage({channel:HTML_CHANNEL,...m},org)}catch(_){}};
 const t=examTest,d=event.data;
 if(examMode!=='take'||!t||!current)return reply({type:'error',message:'Preview mode: essays are not saved.'});
 if(isAdmin())return reply({type:'error',message:'Instructor preview: essays are not saved. Sign in as a trainee to submit.'});
 if(!isWritingTest(t))return reply({type:'error',message:'This test is not a writing test.'});
 if(!eligible(t))return reply({type:'error',message:'This test is not active or not assigned to you.',final:true});
 if(ownSub(t.id))return reply({type:'error',message:'You have already submitted this test.',final:true});
 const text=typeof d.text==='string'?d.text.slice(0,30000):'';
 if(!text.trim())return reply({type:'error',message:'The essay is empty.'});
 if(busy)return;busy=true;
 try{
  const n=v=>Math.max(0,Math.min(100000,Math.round(Number(v)||0)));
  const data={testId:t.id,userId:current.uid,date:new Date().toISOString(),status:'Pending grading',score:null,maxScore:null,band:null,feedback:'',response:text,answers:[],reviewState:null,source:'html-writing',
   wordCount:n(d.wordCount),timeSpent:n(d.timeSpent),integrity:{paste:n(d.pasteBlocked),copy:n(d.copyBlocked),fullscreenExits:n(d.fullscreenExits),leftTest:n(d.leftTest)}};
  await setDoc(doc(fs,'submissions',`${current.uid}_${t.id}`),data);
  reply({type:'saved'});await refresh();
 }catch(e){let m=e.message||String(e);if(e.code==='permission-denied')m='Firestore refused the save. Check that this test is active and assigned to you and that the latest firestore.rules are published.';reply({type:'error',message:m});message(e)}
 finally{busy=false}
}
const WCRIT=task=>[['tr',task===1?'Task Achievement':'Task Response'],['cc','Coherence & Cohesion'],['lr','Lexical Resource'],['gra','Grammatical Range & Accuracy']];
const taskNo=t=>/Task 1/.test(t?.cat||'')?1:2;
const fmtMin=s=>s?`${Math.floor(s/60)} min ${s%60} s`:'–';
function gradeWriting(s,t,u){const C=WCRIT(taskNo(t)),c=s.criteria||{},opts=v=>Array.from({length:19},(_,i)=>i/2).map(n=>`<option value="${n}" ${v===n?'selected':''}>${n.toFixed(1)}</option>`).join(''),ig=s.integrity||{};
showModal(`<h2>Writing assessment</h2><p><b>${esc(u?.name||s.userId)}</b> • ${esc(t?.title||s.testId)} • ${esc((s.date||'').slice(0,10))}</p>
<p class="small muted">${esc(s.wordCount??'?')} words • time spent ${fmtMin(s.timeSpent)} • blocked paste attempts: ${esc(ig.paste??0)} • blocked copy attempts: ${esc(ig.copy??0)} • left full screen: ${esc(ig.fullscreenExits??0)} • switched away: ${esc(ig.leftTest??0)}</p>
<form id="gradeForm"><label class="field">Student's essay — edit this copy to mark corrections (e.g. <i>[went → had gone]</i>). The student sees this marked copy.<textarea name="marked" style="min-height:300px;font:15px/1.7 Georgia,serif">${esc(s.markedText??s.response??'')}</textarea></label>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${C.map(([k,l])=>`<label class="field">${l}<select name="${k}"><option value="">–</option>${opts(c[k])}</select></label>`).join('')}</div>
<label class="field">Overall band (average of the four criteria, rounded to 0.5)<select name="band">${opts(s.band)}</select></label>
<label class="field">Feedback for the student<textarea name="feedback" style="min-height:130px" placeholder="Strengths, main areas to improve, advice for the next essay…">${esc(s.feedback||'')}</textarea></label>
<div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Close</button><button class="btn">Save assessment</button></div></form>`);
document.getElementById('cancelModal').onclick=closeModal;const f=document.getElementById('gradeForm');
f.onchange=e=>{if(C.some(([k])=>k===e.target.name)){let v=C.map(([k])=>f[k].value).filter(x=>x!=='').map(Number);if(v.length===4)f.band.value=String(Math.round(v.reduce((a,b)=>a+b,0)/4*2)/2)}};
f.onsubmit=async e=>{e.preventDefault();try{let band=Number(f.band.value),criteria={};C.forEach(([k])=>{if(f[k].value!=='')criteria[k]=Number(f[k].value)});await updateDoc(doc(fs,'submissions',s.id),{band,score:band,maxScore:9,criteria,markedText:f.marked.value,feedback:f.feedback.value,status:'Completed'});closeModal();await refresh();render();alert('Assessment saved. The student can now see the band, feedback and marked essay.')}catch(err){message(err)}}}
function writingResultHtml(s){if(s.source!=='html-writing')return '';const C=WCRIT(taskNo(byId(s.testId))),box='white-space:pre-wrap;max-height:40vh;overflow:auto;border:1px solid #e1e7f0;border-radius:10px;padding:12px;font:15px/1.7 Georgia,serif',sum='cursor:pointer;font-weight:650;color:#235dd1';
 return `${s.criteria?`<div class="small" style="margin:8px 0">${C.map(([k,l])=>`${l}: <b>${esc(s.criteria[k]??'–')}</b>`).join(' • ')}</div>`:''}${s.markedText&&s.status==='Completed'?`<details open><summary style="${sum}">Marked essay (teacher's corrections)</summary><div style="${box}">${esc(s.markedText)}</div></details>`:''}<details><summary style="${sum}">My essay as submitted (${esc(s.wordCount??'')} words)</summary><div style="${box}">${esc(s.response||'')}</div></details>`}
// ---- Speaking tests (HTML): answers are recorded in the browser, uploaded to Storage, then marked by the instructor ----
const isSpeakingHtml=t=>t&&t.cat==='Speaking'&&/\.html?$/i.test(t.resourceName||'');
async function launchSpeakingTest(t,mode){
 try{
  if(!t.resourcePath)throw Error('No HTML file attached.');
  let url=t.resourceURL||'';
  if(!url)url=await getDownloadURL(ref(storage,t.resourcePath));
  if(!/^https:\/\/firebasestorage\.googleapis\.com\//i.test(url))throw Error('Invalid Firebase Storage file URL.');
  clearInterval(timer);page='html-exam';render();
  document.getElementById('content').innerHTML=`<div class="head"><h1>${esc(t.title)}${mode==='preview'?' — Instructor Preview':''}</h1><button class="btn secondary" id="backToTests">Leave test</button></div><div class="notice small" style="margin:0 0 10px">Allow microphone access when your browser asks. Do not leave this page until you see “Your speaking test has been submitted”.</div><iframe id="speakFrame" src="${esc(url)}" allow="microphone; fullscreen; autoplay" allowfullscreen style="width:100%;height:80vh;border:1px solid #d6deea;border-radius:12px;background:#fff"></iframe>`;
  examWindow=document.getElementById('speakFrame').contentWindow;examMode=mode;examTest=t;examReview=null;++examNonce;
  document.getElementById('backToTests').onclick=async()=>{if(mode==='take'&&!ownSub(t.id)&&!await ask('Leave the speaking test? Recordings that have not been submitted will be lost.',{ok:'Leave test',danger:true}))return;examWindow=null;page='tests';render()};
 }catch(e){message(e);page='tests';render()}
}
async function saveSpeaking(event){
 const src=event.source,org=event.origin,reply=m=>{try{src.postMessage({channel:HTML_CHANNEL,...m},org)}catch(_){}};
 const t=examTest,d=event.data;
 if(examMode!=='take'||!t||!current)return reply({type:'error',message:'Preview mode: recordings are not saved.'});
 if(isAdmin())return reply({type:'error',message:'Instructor preview: recordings are not saved. Sign in as a trainee to submit.'});
 if(t.cat!=='Speaking')return reply({type:'error',message:'This test is not a speaking test.'});
 if(!eligible(t))return reply({type:'error',message:'This test is not active or not assigned to you.',final:true});
 if(ownSub(t.id))return reply({type:'error',message:'You have already submitted this test.',final:true});
 const recs=Array.isArray(d.recordings)?d.recordings:[];
 if(!recs.length||recs.length>40)return reply({type:'error',message:'No recordings received.'});
 for(const r of recs){if(!(r.blob instanceof Blob)||!r.blob.size||r.blob.size>15*1024*1024||!/^(audio|video)\//.test(r.blob.type||'audio/webm'))return reply({type:'error',message:'A recording is empty, too large (over 15 MB) or not audio.'})}
 if(busy)return;busy=true;
 try{
  const stamp=Date.now(),out=[];
  for(let i=0;i<recs.length;i++){
   const r=recs[i],type=r.blob.type||'audio/webm',ext=/mp4|m4a|aac/.test(type)?'m4a':/ogg/.test(type)?'ogg':'webm';
   const safe=String(r.id||('q'+(i+1))).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,20)||('q'+(i+1));
   const path=`speaking/${current.uid}/${t.id}/${stamp}-${safe}.${ext}`;
   reply({type:'progress',done:i,total:recs.length});
   await uploadBytes(ref(storage,path),r.blob,{contentType:type});
   out.push({id:safe,part:Number(r.part)||0,topic:String(r.topic||'').slice(0,120),question:String(r.question||'').slice(0,400),seconds:Math.round((Number(r.seconds)||0)*10)/10,path});
   reply({type:'progress',done:i+1,total:recs.length});
  }
  const data={testId:t.id,userId:current.uid,date:new Date().toISOString(),status:'Pending grading',score:null,maxScore:null,band:null,feedback:'',response:`Speaking test • ${out.length} recordings`,answers:[],reviewState:null,source:'html-speaking',recordings:out,notes:String(d.notes||'').slice(0,3000)};
  await setDoc(doc(fs,'submissions',`${current.uid}_${t.id}`),data);
  reply({type:'saved'});await refresh();
 }catch(e){let m=e.message||String(e);if(e.code==='storage/unauthorized')m='Firebase Storage refused the upload. The instructor needs to publish the latest storage.rules.';else if(e.code==='permission-denied')m='Firestore refused the save. Check that this test is active and assigned to you and that the latest firestore.rules are published.';reply({type:'error',message:m});message(e)}
 finally{busy=false}
}
const CRIT=[['fc','Fluency & Coherence'],['lr','Lexical Resource'],['gra','Grammatical Range & Accuracy'],['pr','Pronunciation']];
const overallBand=c=>{let v=CRIT.map(([k])=>Number(c?.[k])).filter(Number.isFinite);return v.length===4?Math.round(v.reduce((a,b)=>a+b,0)/4*2)/2:null};
function recordingsHtml(s){const parts=[1,2,3];return parts.map(p=>{let rs=(s.recordings||[]).filter(r=>r.part===p);if(!rs.length)return '';return `<h3 style="margin:14px 0 6px">Part ${p}</h3>${rs.map(r=>`<div style="padding:8px 0;border-bottom:1px solid #e1e7f0"><div class="small"><b>${esc(r.question)}</b> <span class="muted">(${esc(r.seconds)}s)</span></div><audio controls preload="none" data-rec="${esc(r.path)}" style="width:100%;height:38px;margin-top:4px"></audio></div>`).join('')}${p===2&&s.notes?`<div class="small muted" style="white-space:pre-wrap;margin-top:6px"><b>Student notes:</b> ${esc(s.notes)}</div>`:''}`}).join('')}
async function loadRecordings(){for(const a of document.querySelectorAll('audio[data-rec]')){try{a.src=await getDownloadURL(ref(storage,a.dataset.rec))}catch(e){a.insertAdjacentHTML('afterend','<div class="small error">Could not load this recording: '+esc(e.code||e.message)+'</div>')}}}

function speakingResultHtml(s){if(!s.recordings)return '';return `${s.criteria?`<div class="small" style="margin:8px 0">${CRIT.map(([k,l])=>`${l}: <b>${esc(s.criteria[k]??'–')}</b>`).join(' • ')}</div>`:''}<details id="myRecs"><summary style="cursor:pointer;font-weight:650;color:#235dd1">Listen to my recordings (${s.recordings.length})</summary><div style="max-height:45vh;overflow:auto">${recordingsHtml(s)}</div></details>`}
function gradeSpeaking(s,t,u){const opts=v=>Array.from({length:19},(_,i)=>i/2).map(n=>`<option value="${n}" ${v===n?'selected':''}>${n.toFixed(1)}</option>`).join('');const c=s.criteria||{};
showModal(`<h2>Speaking assessment</h2><p><b>${esc(u?.name||s.userId)}</b> • ${esc(t?.title||s.testId)} • ${esc((s.date||'').slice(0,10))}</p><div style="max-height:46vh;overflow:auto;border:1px solid #e1e7f0;border-radius:10px;padding:4px 14px 12px">${recordingsHtml(s)}</div>
<form id="gradeForm" style="margin-top:14px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${CRIT.map(([k,l])=>`<label class="field">${l}<select name="${k}"><option value="">–</option>${opts(c[k])}</select></label>`).join('')}</div>
<label class="field">Overall band (average of the four criteria, rounded to 0.5)<select name="band">${opts(s.band)}</select></label><label class="field">Feedback for the student<textarea name="feedback" style="min-height:140px" placeholder="Strengths, areas to improve, and comments for each part…">${esc(s.feedback||'')}</textarea></label><div class="row spread"><button type="button" class="btn secondary" id="cancelModal">Close</button><button class="btn">Save assessment</button></div></form>`);
document.getElementById('cancelModal').onclick=closeModal;loadRecordings();const f=document.getElementById('gradeForm');
f.onchange=e=>{if(CRIT.some(([k])=>k===e.target.name)){let cr=Object.fromEntries(CRIT.map(([k])=>[k,f[k].value===''?NaN:Number(f[k].value)]));let o=overallBand(cr);if(o!=null)f.band.value=String(o)}};
f.onsubmit=async e=>{e.preventDefault();try{let band=Number(f.band.value),criteria={};CRIT.forEach(([k])=>{if(f[k].value!=='')criteria[k]=Number(f[k].value)});await updateDoc(doc(fs,'submissions',s.id),{band,score:band,maxScore:9,criteria,feedback:f.feedback.value,status:'Completed'});closeModal();await refresh();render();alert('Assessment saved. The student can now see the band and feedback.')}catch(err){message(err)}}}
window.addEventListener('message',async event=>{
 if(event.data?.channel===HTML_CHANNEL&&event.data.type==='writing_submit'&&examWindow&&event.source===examWindow&&event.origin==='https://firebasestorage.googleapis.com'){await saveWriting(event);return}
 if(event.data?.channel===HTML_CHANNEL&&event.data.type==='speaking_submit'&&examWindow&&event.source===examWindow&&event.origin==='https://firebasestorage.googleapis.com'){await saveSpeaking(event);return}
 if(event.data?.channel!==HTML_CHANNEL||event.data.type!=='submit'||!examWindow||event.source!==examWindow||event.origin!=='https://firebasestorage.googleapis.com')return;
 if(examMode!=='take'||!examTest||!current||isAdmin())return;
 const t=examTest,d=event.data,score=d.score,max=d.maxScore,band=d.band;
 if(!['Listening','Reading'].includes(t.cat)||!eligible(t)||ownSub(t.id))return;
 if(!Number.isInteger(score)||!Number.isInteger(max)||max<1||max>100||score<0||score>max||!Number.isFinite(band)||band<1||band>9||Math.round(band*2)!==band*2){event.source.postMessage({channel:HTML_CHANNEL,type:'error',message:'Invalid score or IELTS band.'},event.origin);return}
 if(busy)return;busy=true;const source=event.source;
 try{
  const id=`${current.uid}_${t.id}`;
  // Firestore create-only rule prevents a second submission; do not read a missing document.
  const data={testId:t.id,userId:current.uid,date:new Date().toISOString(),status:'Completed',score,maxScore:max,band,feedback:'',response:'HTML exam',answers:[],reviewState:d.reviewState?JSON.parse(JSON.stringify(d.reviewState)):null,source:'html-bridge'};
  await setDoc(doc(fs,'submissions',id),data);
  source.postMessage({channel:HTML_CHANNEL,type:'saved'},event.origin);
  await refresh();
 }catch(e){let m=e.message||String(e);if(e.code==='permission-denied')m='Firestore refused the save (permission-denied). Check that this test is ACTIVE and ASSIGNED to you, that you have not already submitted it, and that the instructor has published the latest firestore.rules.';source.postMessage({channel:HTML_CHANNEL,type:'error',message:m},event.origin);message(e)}finally{busy=false}
});

// ---- Instructor notifications: "<trainee> finished <test>" ----
// Shown when the instructor opens the site (everything submitted since the last "Mark as read"),
// via the 🔔 counter, and as a live pop-up while the site is open.
let notifUnsub=null;const SEEN_KEY=()=>'ielts-notif-seen-'+current?.uid;
function seenAt(){let local='';try{local=localStorage.getItem(SEEN_KEY())||''}catch(_){}const remote=profile?.notifSeenAt||'';const v=remote>local?remote:local;return v||new Date(Date.now()-7*864e5).toISOString()}
const unseenSubs=()=>{const since=seenAt();return submissions.filter(s=>(s.date||'')>since).sort((a,b)=>(b.date||'').localeCompare(a.date||''))};
const traineeName=s=>users.find(u=>u.id===s.userId)?.name||s.userId;
const subSummary=s=>s.status==='Pending grading'?'Awaiting your marking':s.score!=null?`Score ${s.score}/${s.maxScore}${s.band!=null?' • Band '+s.band:''}`:esc(s.status);
const whenText=d=>{if(!d)return '';const m=Math.round((Date.now()-new Date(d))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':new Date(d).toLocaleString()};
function updateBell(){const el=document.getElementById('bellCount');if(!el)return;const n=unseenSubs().length;el.textContent=n;el.classList.toggle('zero',!n)}
async function markNotificationsRead(){const now=new Date().toISOString();try{localStorage.setItem(SEEN_KEY(),now)}catch(_){}profile.notifSeenAt=now;try{await updateDoc(doc(fs,'users',current.uid),{notifSeenAt:now})}catch(e){console.warn('Could not save read time to Firestore; kept in this browser only.',e)}updateBell()}
function showNotifications(){const list=unseenSubs();showModal(`<h2>🔔 Finished tests</h2>${list.length?`<p class="muted">${list.length} new submission${list.length>1?'s':''} since you last checked.</p>${list.map(s=>`<div class="notif"><div><b>${esc(traineeName(s))}</b> finished <b>${esc(byId(s.testId)?.title||s.testId)}</b><div class="small muted">${esc(byId(s.testId)?.cat||'')} • ${esc(whenText(s.date))} • ${subSummary(s)}</div></div><button class="btn tiny secondary" data-notif-grade="${esc(s.id)}">${s.status==='Pending grading'?'Mark':'Review'}</button></div>`).join('')}`:'<div class="empty">No new finished tests.</div>'}<div class="row spread" style="margin-top:16px"><button class="btn secondary" id="notifLater">Remind me later</button>${list.length?'<button class="btn" id="notifRead">Mark all as read</button>':''}</div>`);
 document.getElementById('notifLater').onclick=closeModal;document.getElementById('notifRead')?.addEventListener('click',async()=>{await markNotificationsRead();closeModal()});
 document.querySelectorAll('[data-notif-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.notifGrade))}
function toast(html,onClick,kind){let box=document.getElementById('toasts');if(!box){box=document.createElement('div');box.id='toasts';box.className='toasts';document.body.append(box)}const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.innerHTML=html;t.onclick=()=>{t.remove();onClick?.()};box.append(t);setTimeout(()=>t.remove(),10000)}
function startNotifications(){stopNotifications();let first=true;
 notifUnsub=onSnapshot(collection(fs,'submissions'),snap=>{
  if(first){first=false;return}  // first snapshot = data already loaded by refresh()
  snap.docChanges().forEach(ch=>{const s={id:ch.doc.id,...ch.doc.data()};const i=submissions.findIndex(x=>x.id===s.id);
   if(i>=0)submissions[i]=s;else submissions.push(s);
   if(ch.type==='added'&&i<0&&(s.date||'')>seenAt()){toast(`🔔 <b>${esc(traineeName(s))}</b> finished <b>${esc(byId(s.testId)?.title||s.testId)}</b><small>${subSummary(s)} • click to open</small>`,()=>grade(s.id));try{document.title='🔔 New submission — Ashraf IELTS'}catch(_){}}});
  updateBell()},err=>console.warn('Live notifications unavailable',err))}
function stopNotifications(){if(notifUnsub){notifUnsub();notifUnsub=null}}
window.addEventListener('focus',()=>{if(document.title.startsWith('🔔'))document.title='Ashraf IELTS Practice — Online'});

onAuthStateChanged(auth,async user=>{stopNotifications();current=user;profile=null;if(!user){clearInterval(timer);login();return}try{let snap=await getDoc(doc(fs,'users',user.uid));if(!snap.exists()||!snap.data().active){root.innerHTML=`<div class="login"><div class="loginbox"><div class="loginlogo">${ICON.logo}</div><h2>Your account isn’t active</h2><p class="muted">Please ask your instructor to activate your account, then sign in again.</p><button id="exit" class="btn">Sign out</button></div></div>`;document.getElementById('exit').onclick=()=>signOut(auth);return}profile=snap.data();await refresh();page='dashboard';render();if(isAdmin()){startNotifications();if(unseenSubs().length)showNotifications()}}catch(e){root.innerHTML=`<div class="login"><div class="loginbox"><div class="loginlogo">${ICON.logo}</div><h2>We couldn’t load your portal</h2><p class="muted">Check your internet connection and refresh the page.</p><p class="error">${esc(friendlyError(e))}</p><button id="exit" class="btn">Sign out</button></div></div>`;document.getElementById('exit').onclick=()=>signOut(auth)}});login();
</script></body></html>
