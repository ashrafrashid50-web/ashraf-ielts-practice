<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashraf IELTS Practice — Academic</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#18263c;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101e3d,#256a93)}.loginbox{background:white;padding:34px;border-radius:22px;width:min(420px,94vw);box-shadow:0 20px 60px #0003}.loginbox h1{margin:8px 0}.logo{display:inline-grid;place-items:center;background:#15b8a6;color:white;border-radius:12px;width:44px;height:44px;font-weight:900}.muted{color:#69778d}.small{font-size:12px}.field{display:grid;gap:6px;margin:12px 0}input,select,textarea{border:1px solid #d6deea;border-radius:10px;padding:11px;background:white;width:100%;color:#18263c}textarea{min-height:130px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;background:#235dd1;color:white;font-weight:650}.btn.secondary{background:#e8eef8;color:#24436b}.btn.danger{background:#fce8e9;color:#b42332}.btn.green{background:#0b927f}.btn.tiny{padding:7px 10px;font-size:12px}.shell{display:flex;min-height:100vh}.side{width:250px;background:#142442;color:#e8f0ff;padding:23px 14px;flex-shrink:0}.brand{font-size:19px;font-weight:800;margin:8px 10px 30px}.nav{display:flex;align-items:center;gap:10px;border:0;background:none;color:#b6c6df;padding:13px 15px;width:100%;text-align:left;border-radius:10px;margin-bottom:5px}.nav.active,.nav:hover{background:#284366;color:white}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e3e8f1;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.content{padding:26px;max-width:1350px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.head h1{margin:0 0 5px;font-size:27px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.card{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:20px;box-shadow:0 4px 18px #1d3d6609}.metric{font-size:32px;font-weight:850;color:#183b7b;margin:8px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf1f8;color:#48607f;font-size:12px;font-weight:700}.tag.good{background:#d9f7ee;color:#08755f}.tag.warn{background:#fff1d6;color:#926005}.tag.bad{background:#fde8e9;color:#b42332}.sectioncards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:20px 0}.sectioncard{background:white;border:1px solid #dce4f1;border-radius:15px;padding:17px;text-align:left;cursor:pointer}.sectioncard strong{display:block;margin:12px 0 5px}.sectioncard span{color:#61758f;font-size:13px}.sectioncard:hover{border-color:#2b69d9}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;background:#f3f6fb;color:#506581;font-size:12px;text-transform:uppercase;letter-spacing:.4px}.tbl td,.tbl th{padding:12px;border-bottom:1px solid #e8edf5;vertical-align:middle}.tbl td .btn{margin:2px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar input{max-width:280px}.toolbar select{max-width:230px}.modalbg{position:fixed;inset:0;background:#0b1b36a6;display:grid;place-items:center;padding:18px;z-index:9}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 20px 70px #0004}.modal h2{margin:0}.checklist{max-height:200px;overflow:auto;border:1px solid #dfe6f0;border-radius:10px;padding:10px}.checklist label{display:block;padding:6px}.checklist input{width:auto}.empty{text-align:center;padding:35px;color:#69778d}.notice{background:#eaf4ff;border-left:4px solid #3384e4;padding:13px;border-radius:7px;margin:12px 0}.question{border:1px solid #e2e8f2;border-radius:12px;padding:15px;margin:12px 0}.question label{display:block;margin:9px 0}.question input[type=radio]{width:auto}.testslot{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e9eef5;padding:12px 0}.testslot:last-child{border:0}.link{background:none;border:0;color:#245ed1;font-weight:700;padding:5px}.progress{height:8px;border-radius:10px;background:#e4eaf4;overflow:hidden}.progress>div{height:100%;background:#18a99b}.foot{font-size:12px;color:#708098;margin-top:20px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.sectioncards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{display:block}.side{width:100%;padding:10px}.brand{margin:6px}.side nav{display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}.top{padding:14px}.content{padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.sectioncards{grid-template-columns:1fr 1fr}.card{padding:14px}}@media(max-width:420px){.sectioncards{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const KEY='ashraf_ielts_academic_v1',CATS=['Listening','Reading','Writing Task 1','Writing Task 2','Speaking'];let db=load(),current=null,page='dashboard',category=CATS[0],modal='',selectedTest=null,filter='',editQuestion=-1;
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.users&&d.tests)return d}catch(e){}return {users:[{id:'admin',username:'admin',password:'Admin@123',name:'Instructor Ashraf',group:'',active:true,role:'admin'}],tests:CATS.flatMap((cat,c)=>Array.from({length:10},(_,i)=>({id:`t${c}_${i+1}`,cat,num:i+1,title:`${cat} — Test ${i+1}`,active:false,assign:[],questions:[],prompt:'',duration:60}))),submissions:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function byId(id){return db.tests.find(x=>x.id===id)}function users(){return db.users.filter(x=>x.role!=='admin')}function subs(id){return db.submissions.filter(s=>s.userId===id)}function sub(u,t){return db.submissions.find(s=>s.userId===u&&s.testId===t)}function assigned(t,u){return t.assign.includes(u.id)||t.assign.includes('ALL')||(u.group&&t.assign.includes('GROUP:'+u.group))}function eligible(t,u){return t.active&&assigned(t,u)}function pill(s){return `<span class="tag ${s==='Completed'?'good':s==='Pending grading'?'warn':s==='Inactive'?'bad':''}">${s}</span>`}function login(){document.getElementById('app').innerHTML=`<div style="min-height:100vh;background:#f3f6fc"><header style="background:#142442;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px"><div style="font-size:23px;font-weight:850">✦ Ashraf IELTS Practice <span style="font-size:13px;color:#9ecde5">ACADEMIC</span></div><a href="#sign-in" class="btn" style="text-decoration:none">Login to start →</a></header><main style="max-width:1160px;margin:auto;padding:35px 20px"><div class="card" style="background:linear-gradient(120deg,#183b7b,#167d9b);color:white;padding:32px"><h1 style="font-size:clamp(28px,4vw,45px);margin:0">IELTS Academic preparation</h1><p style="font-size:17px">Five practice sections. Fifty test slots. Personal results and instructor feedback.</p><p>Explore the sections below. Sign in with the username and password provided by your instructor to start assigned tests.</p></div><h2 style="margin-top:30px">Practice sections</h2><div class="sectioncards">${CATS.map((c,i)=>`<div class="sectioncard" style="cursor:default"><div style="font-size:30px">${['🎧','📖','📝','✍️','🎥'][i]}</div><strong>${c}</strong><span>10 tests • Login required</span></div>`).join('')}</div><div class="card" id="sign-in" style="max-width:470px;margin:30px auto"><h2>Login to your account</h2><p class="muted">One website for instructor and students</p><form onsubmit="doLogin(event)"><label class="field">Username<input id="loginuser" required autocomplete="username"></label><label class="field">Password<input id="loginpass" type="password" required autocomplete="current-password"></label><p id="loginerror" style="color:#b42332"></p><button class="btn" style="width:100%">Sign in →</button></form><p class="small muted">Local demonstration only. Real online logins require secure hosting and a backend.</p></div></main></div>`}
function doLogin(e){e.preventDefault();let u=db.users.find(x=>x.username.toLowerCase()===document.getElementById('loginuser').value.trim().toLowerCase()&&x.password===document.getElementById('loginpass').value);if(!u||!u.active){document.getElementById('loginerror').textContent='Incorrect credentials or disabled account';return}current=u;page='dashboard';render()}function logout(){current=null;login()}
function render(){if(!current)return login();let admin=current.role==='admin',items=admin?[['dashboard','▦','Overview'],['users','♙','Trainees'],['tests','▤','Test Library'],['assignments','☑','Assignments'],['grading','✎','Marking & Scores'],['reports','▥','Reports']]:[['dashboard','▦','My Dashboard'],['tests','▤','My Tests'],['reports','▥','My Results']];document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand">✦ Ashraf IELTS<br><span style="font-size:12px;color:#9eb7d6;font-weight:400">ACADEMIC PRACTICE</span></div><nav>${items.map(([p,i,n])=>`<button class="nav ${page===p?'active':''}" onclick="navigate('${p}')"><span>${i}</span>${n}</button>`).join('')}</nav></aside><main class="main"><header class="top"><div><b>${admin?'Instructor Portal':'Student Portal'}</b> <span class="muted small">/ ${esc(page)}</span></div><div class="row"><span class="small">${esc(current.name)}</span><button class="btn secondary tiny" onclick="logout()">Sign out</button></div></header><div class="content" id="content"></div></main></div>`;({dashboard:dashboard,users:usersPage,tests:testsPage,assignments:assignmentsPage,grading:gradingPage,reports:reportsPage}[page]||dashboard)()}
function navigate(p){page=p;filter='';render()}function setCategory(cat){category=cat;page='tests';render()}function dashboard(){let admin=current.role==='admin',ss=admin?db.submissions:subs(current.id),done=ss.filter(x=>x.status==='Completed').length;let stats=admin?[[users().length,'Total trainees'],[db.tests.filter(x=>x.active).length,'Active tests'],[ss.length,'Submissions'],[ss.filter(x=>x.status==='Pending grading').length,'To be graded']]:[[db.tests.filter(t=>eligible(t,current)).length,'Available tests'],[done,'Completed'],[ss.filter(x=>x.status==='Pending grading').length,'Awaiting grading'],[50,'Test slots']];document.getElementById('content').innerHTML=`<div class="head"><div><h1>Welcome, ${esc(current.name)}</h1><p class="muted">${admin?'Manage your IELTS Academic training in one place.':'Your IELTS Academic learning journey.'}</p></div>${admin?'<button class="btn" onclick="openUser()">+ Add trainee</button>':''}</div><div class="grid">${stats.map(([n,l])=>`<div class="card"><div class="muted small">${l}</div><div class="metric">${n}</div></div>`).join('')}</div><h2>Practice sections</h2><div class="sectioncards">${CATS.map((c,i)=>`<button class="sectioncard" onclick="setCategory('${c}')"><div style="font-size:27px">${['🎧','📖','📝','✍️','🎥'][i]}</div><strong>${c}</strong><span>10 test slots • ${admin?db.tests.filter(t=>t.cat===c&&t.active).length:db.tests.filter(t=>t.cat===c&&eligible(t,current)).length} available</span></button>`).join('')}</div><div class="card"><h3>${admin?'Recent submissions':'Your recent activity'}</h3>${ss.length?tableSub(ss.slice(-5).reverse(),admin):'<div class="empty">No submissions yet. Your progress will appear here.</div>'}</div><div class="foot">Prototype: records are stored only in this browser. Online student accounts and cross-device video submissions require a secure backend.</div>`}
function usersPage(){if(current.role!=='admin')return navigate('dashboard');let u=users().filter(x=>(x.name+' '+x.username+' '+x.group).toLowerCase().includes(filter.toLowerCase()));document.getElementById('content').innerHTML=`<div class="head"><div><h1>Trainee management</h1><p class="muted">Create usernames and passwords, organize groups, disable or delete trainees.</p></div><button class="btn" onclick="openUser()">+ Create trainee</button></div><div class="card"><div class="toolbar"><input placeholder="Search name, username, group" value="${esc(filter)}" oninput="filter=this.value;usersPage()"><span class="tag">${users().length} accounts</span></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Group</th><th>Account</th><th>Actions</th></tr></thead><tbody>${u.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.username)}</td><td>${esc(x.group||'—')}</td><td>${pill(x.active?'Active':'Inactive')}</td><td><button class="btn secondary tiny" onclick="openUser('${x.id}')">Edit</button><button class="btn secondary tiny" onclick="toggleUser('${x.id}')">${x.active?'Disable':'Enable'}</button><button class="btn danger tiny" onclick="deleteUser('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}function openUser(id=''){let u=db.users.find(x=>x.id===id)||{};showModal(`<h2>${id?'Edit trainee':'Create trainee'}</h2><form onsubmit="saveUser(event,'${id}')"><label class="field">Full name<input name="name" value="${esc(u.name||'')}" required></label><label class="field">Username<input name="username" value="${esc(u.username||'')}" required></label><label class="field">${id?'New password (leave blank to keep current)':'Password'}<input name="password" ${id?'':'required'}></label><label class="field">Group / Cohort<input name="group" value="${esc(u.group||'')}" placeholder="e.g. October Group A"></label><div class="row spread"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Save trainee</button></div></form>`)}function saveUser(e,id){e.preventDefault();let f=e.target,username=f.username.value.trim();if(db.users.some(x=>x.username.toLowerCase()===username.toLowerCase()&&x.id!==id)){alert('Username already exists');return}let u=db.users.find(x=>x.id===id);if(u){u.name=f.name.value.trim();u.username=username;u.group=f.group.value.trim();if(f.password.value)u.password=f.password.value}else db.users.push({id:'u'+Date.now(),name:f.name.value.trim(),username,password:f.password.value,group:f.group.value.trim(),role:'student',active:true});save();closeModal();render()}function toggleUser(id){let u=db.users.find(x=>x.id===id);u.active=!u.active;save();render()}function deleteUser(id){let u=db.users.find(x=>x.id===id);if(!confirm(`Permanently delete ${u.name} and their submissions from this local prototype?`))return;db.users=db.users.filter(x=>x.id!==id);db.submissions=db.submissions.filter(x=>x.userId!==id);db.tests.forEach(t=>t.assign=t.assign.filter(a=>a!==id));save();render()}
function testsPage(){let admin=current.role==='admin';let list=db.tests.filter(t=>t.cat===category);document.getElementById('content').innerHTML=`<div class="head"><div><h1>${admin?'Test Library':'My Tests'}</h1><p class="muted">${admin?'Prepare, activate and assign up to 10 tests per section.':'Only assigned, active tests are available.'}</p></div></div><div class="toolbar"><select onchange="category=this.value;testsPage()">${CATS.map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select><span class="tag">10 tests</span></div><div class="card">${list.map(t=>{let s=admin?null:sub(current.id,t.id),ok=admin||eligible(t,current);return `<div class="testslot"><div><b>${esc(t.title)}</b><div class="row" style="margin-top:7px">${pill(t.active?'Active':'Inactive')} ${admin?`<span class="small muted">${t.assign.includes('ALL')?'All trainees':t.assign.length+' assignment targets'}</span>`:s?pill(s.status):ok?pill('Not started'):pill('Not assigned')} ${s&&s.score!==null?`<span class="tag good">${s.score}/${s.maxScore} • Band ${s.band??'—'}</span>`:''}</div></div><div class="row">${admin?`<button class="btn secondary tiny" onclick="editTest('${t.id}')">Edit / Upload</button><button class="btn secondary tiny" onclick="assignTest('${t.id}')">Assign</button><button class="btn ${t.active?'danger':'green'} tiny" onclick="toggleTest('${t.id}')">${t.active?'Deactivate':'Activate'}</button>`:s?`<button class="btn secondary tiny" onclick="viewResult('${t.id}')">View status</button>`:ok?`<button class="btn tiny" onclick="takeTest('${t.id}')">Start test</button>`:''}</div></div>`}).join('')}</div>`}function toggleTest(id){let t=byId(id);t.active=!t.active;save();render()}
function editTest(id){let t=byId(id);selectedTest=id;let objective=['Listening','Reading'].includes(t.cat);showModal(`<h2>Edit ${esc(t.title)}</h2><p class="muted">${objective?'Add multiple-choice questions and an audio URL for Listening.':'Set the writing prompt or speaking video questions.'}</p><form onsubmit="saveTest(event,'${id}')"><label class="field">Test title<input name="title" value="${esc(t.title)}" required></label><label class="field">Duration (minutes)<input type="number" min="1" name="duration" value="${t.duration}" required></label><label class="field">${objective?'Reading passage / instructions':'Task prompt / speaking questions'}<textarea name="prompt">${esc(t.prompt)}</textarea></label><div class="notice"><b>Upload test files from your PC</b><p class="small">PDF, Word, HTML, images and MP3 are supported as attached resources. Uploads stay on this browser in the prototype; they are not shared online. Use the MCQ editor/JSON import for automatic marking.</p><input type="file" id="testResourceFile" accept=".pdf,.doc,.docx,.html,.htm,.txt,.png,.jpg,.jpeg,.mp3,.wav,.m4a" onchange="uploadTestResource('${id}',this)"/><div id="resourceInfo">${t.resourceName?`Current file: ${esc(t.resourceName)} <button type="button" class="btn secondary tiny" onclick="openTestResource('${id}')">View / Download</button> <button type="button" class="btn danger tiny" onclick="removeTestResource('${id}')">Remove</button>`:'No file attached yet'}</div></div>${t.cat==='Listening'?`<label class="field">Audio URL (HTTPS MP3 or compatible source)<input name="audio" value="${esc(t.audio||'')}" placeholder="https://..."></label>`:''}${objective?`<div class="notice">MCQ question bank: ${t.questions.length} questions. Questions are worth 1 mark each.</div><div class="row"><button type="button" class="btn secondary" onclick="addQuestion('${id}')">+ Add MCQ</button><button type="button" class="btn secondary" onclick="importQuestions('${id}')">Import JSON</button></div>`:''}<div class="row spread" style="margin-top:20px"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Save test</button></div></form>`)}function saveTest(e,id){e.preventDefault();let t=byId(id),f=e.target;t.title=f.title.value.trim();t.duration=Number(f.duration.value);t.prompt=f.prompt.value;if(f.audio)t.audio=f.audio.value.trim();save();closeModal();render()}function addQuestion(id){let t=byId(id);showModal(`<h2>Add multiple-choice question</h2><form onsubmit="saveQuestion(event,'${id}')"><label class="field">Question<input name="q" required></label>${[0,1,2,3].map(i=>`<label class="field">Option ${'ABCD'[i]}<input name="o${i}" required></label>`).join('')}<label class="field">Correct answer<select name="answer">${[0,1,2,3].map(i=>`<option value="${i}">${'ABCD'[i]}</option>`).join('')}</select></label><div class="row spread"><button type="button" class="btn secondary" onclick="editTest('${id}')">Back</button><button class="btn">Add question</button></div></form><div class="small muted">Existing questions: ${t.questions.length}</div>${t.questions.map((q,i)=>`<p class="small">${i+1}. ${esc(q.q)} <button class="link" onclick="removeQuestion('${id}',${i})">Remove</button></p>`).join('')}`)}function saveQuestion(e,id){e.preventDefault();let f=e.target;byId(id).questions.push({q:f.q.value,options:[0,1,2,3].map(i=>f['o'+i].value),answer:Number(f.answer.value)});save();addQuestion(id)}function removeQuestion(id,i){byId(id).questions.splice(i,1);save();addQuestion(id)}function importQuestions(id){showModal(`<h2>Import MCQs</h2><p class="small muted">Paste a JSON array: [{"q":"Question?","options":["A","B","C","D"],"answer":0}]</p><textarea id="jsonq" rows="8"></textarea><div class="row"><button class="btn secondary" onclick="editTest('${id}')">Back</button><button class="btn" onclick="saveImport('${id}')">Import</button></div>`)}function saveImport(id){try{let a=JSON.parse(document.getElementById('jsonq').value);if(!Array.isArray(a)||!a.every(q=>q.q&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4))throw Error('Invalid question structure');byId(id).questions.push(...a);save();editTest(id)}catch(e){alert('Invalid JSON: '+e.message)}}
function assignTest(id){let t=byId(id),groups=[...new Set(users().map(u=>u.group).filter(Boolean))];showModal(`<h2>Assign ${esc(t.title)}</h2><p class="muted">Select individual students, groups, or everyone. Existing targets are replaced when saved.</p><form onsubmit="saveAssignment(event,'${id}')"><div class="checklist"><label><input type="checkbox" name="target" value="ALL" ${t.assign.includes('ALL')?'checked':''}> <b>All trainees</b></label>${groups.map(g=>`<label><input type="checkbox" name="target" value="${esc('GROUP:'+g)}" ${t.assign.includes('GROUP:'+g)?'checked':''}> Group: ${esc(g)}</label>`).join('')}${users().map(u=>`<label><input type="checkbox" name="target" value="${u.id}" ${t.assign.includes(u.id)?'checked':''}> ${esc(u.name)} (${esc(u.username)})</label>`).join('')}</div><div class="row spread" style="margin-top:16px"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Save assignments</button></div></form>`)}function saveAssignment(e,id){e.preventDefault();byId(id).assign=[...e.target.querySelectorAll('input[name=target]:checked')].map(x=>x.value);save();closeModal();render()}function assignmentsPage(){document.getElementById('content').innerHTML=`<div class="head"><h1>Assignments</h1></div><div class="card"><p class="muted">Select a test to assign it to individuals, groups or all trainees.</p><div class="tablewrap"><table class="tbl"><tr><th>Test</th><th>Section</th><th>Assigned to</th><th>Action</th></tr>${db.tests.map(t=>`<tr><td>${esc(t.title)}</td><td>${t.cat}</td><td>${t.assign.includes('ALL')?'Everyone':t.assign.length+' targets'}</td><td><button class="btn secondary tiny" onclick="assignTest('${t.id}')">Assign</button></td></tr>`).join('')}</table></div></div>`}
function takeTest(id){let t=byId(id);if(!eligible(t,current)||sub(current.id,id))return alert('This test is not available.');if(!confirm(`Start ${t.title}? You can submit only once.`))return;selectedTest=id;let objective=['Listening','Reading'].includes(t.cat);document.getElementById('content').innerHTML=`<div class="head"><div><h1>${esc(t.title)}</h1><p class="muted">Time limit: ${t.duration} minutes • One submission</p></div><span class="tag warn" id="timer">${t.duration}:00</span></div><form class="card" id="testform" onsubmit="submitTest(event,'${id}')"><div class="notice">${esc(t.prompt||'Your instructor has not added instructions yet.')}</div>${t.resourceName?`<div class="notice"><b>Attached test material:</b> ${esc(t.resourceName)} <button type="button" class="btn secondary tiny" onclick="openTestResource('${id}')">Open / Download</button></div>`:''}${t.cat==='Listening'&&t.audio?`<audio controls style="width:100%" src="${esc(t.audio)}"></audio>`:''}${objective?(t.questions.length?t.questions.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" required> ${'ABCD'[j]}. ${esc(o)}</label>`).join('')}</div>`).join(''):'<div class="notice">No questions have been added to this test. Please contact your instructor.</div>'):t.cat==='Speaking'?`<h3>Record your video answer</h3><p class="muted">Record on your device or choose a video file. Your instructor will assess your speaking and assign a band score.</p><input type="file" id="videoFile" accept="video/*" capture="user" required><p class="small muted">Demo limit 25 MB. Videos are stored locally on this device for prototype demonstration only.</p>`:`<h3>Your response</h3><textarea id="writingAnswer" required placeholder="Write your IELTS Academic response here..."></textarea><p class="small muted">Word count: <span id="words">0</span></p>`}<div class="row spread" style="margin-top:18px"><button class="btn secondary" type="button" onclick="navigate('tests')">Cancel</button><button class="btn" ${objective&&!t.questions.length?'disabled':''}>Submit test</button></div></form>`;if(!objective&&t.cat!=='Speaking')document.getElementById('writingAnswer').addEventListener('input',e=>document.getElementById('words').textContent=e.target.value.trim().split(/\s+/).filter(Boolean).length);startTimer(t.duration,id)}let interval;function startTimer(min,id){clearInterval(interval);let end=Date.now()+min*60000;interval=setInterval(()=>{let el=document.getElementById('timer');if(!el){clearInterval(interval);return}let rem=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=`${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;if(!rem){clearInterval(interval);let form=document.getElementById('testform');if(form){alert('Time expired. Submitting available answers.');submitTest({preventDefault(){}},id,true)}}},1000)}async function submitTest(e,id,expired=false){e.preventDefault();let t=byId(id);if(sub(current.id,id))return;let objective=['Listening','Reading'].includes(t.cat),s={id:'s'+Date.now(),testId:id,userId:current.id,date:new Date().toISOString(),status:objective?'Completed':'Pending grading',score:null,maxScore:null,band:null,feedback:'',response:'',videoId:null};if(objective){let f=new FormData(document.getElementById('testform'));if(!expired&&t.questions.some((q,i)=>!f.has('q'+i))){alert('Answer every question before submitting.');return}s.answers=t.questions.map((q,i)=>f.has('q'+i)?Number(f.get('q'+i)):-1);s.score=t.questions.filter((q,i)=>q.answer===s.answers[i]).length;s.maxScore=t.questions.length;s.band=null}else if(t.cat==='Speaking'){let file=document.getElementById('videoFile').files[0];if(!file){alert('Select a video first.');return}if(file.size>25*1024*1024){alert('Video exceeds the 25 MB demo limit.');return}try{await storeVideo(s.id,file);s.videoId=s.id;s.response=file.name}catch(err){alert('Unable to store video on this device: '+err.message);return}}else{s.response=document.getElementById('writingAnswer').value;if(!s.response.trim()&&!expired){alert('Write your response.');return}}db.submissions.push(s);save();clearInterval(interval);alert(objective?`Submitted. Score: ${s.score}/${s.maxScore}`:'Submitted successfully. Awaiting instructor assessment.');navigate('tests')}
function openResourcesDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('ashraf_ielts_resources',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function uploadTestResource(id,input){let file=input.files[0];if(!file)return;if(file.size>35*1024*1024){alert('File exceeds the 35 MB local prototype limit.');return}try{let d=await openResourcesDB();await new Promise((resolve,reject)=>{let tx=d.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});d.close();byId(id).resourceName=file.name;save();editTest(id)}catch(e){alert('Could not save file on this browser: '+e.message)}}
async function openTestResource(id){try{let d=await openResourcesDB();let f=await new Promise((resolve,reject)=>{let r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});d.close();if(!f)return alert('File is not available on this device.');let url=URL.createObjectURL(f);let a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert(e.message)}}
async function removeTestResource(id){if(!confirm('Remove this attached file?'))return;let d=await openResourcesDB();await new Promise((resolve,reject)=>{let tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});d.close();delete byId(id).resourceName;save();editTest(id)}
function openVideoDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('ashraf_ielts_videos',1);r.onupgradeneeded=()=>r.result.createObjectStore('videos');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function storeVideo(id,file){let d=await openVideoDB();return new Promise((resolve,reject)=>{let tx=d.transaction('videos','readwrite');tx.objectStore('videos').put(file,id);tx.oncomplete=()=>{d.close();resolve()};tx.onerror=()=>reject(tx.error)})}async function playVideo(id){let d=await openVideoDB(),file=await new Promise((resolve,reject)=>{let r=d.transaction('videos').objectStore('videos').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});d.close();if(!file){alert('Video not found on this device. In production, videos must be uploaded to secure cloud storage.');return}let url=URL.createObjectURL(file);showModal(`<h2>Speaking submission</h2><video controls style="width:100%;margin:15px 0" src="${url}"></video><button class="btn secondary" onclick="closeModal()">Close</button>`)}
function tableSub(a,admin){return `<div class="tablewrap"><table class="tbl"><tr><th>Trainee</th><th>Test</th><th>Submitted</th><th>Status</th><th>Score</th>${admin?'<th>Action</th>':''}</tr>${a.map(s=>{let u=db.users.find(x=>x.id===s.userId),t=byId(s.testId);return `<tr><td>${esc(u?.name||'Deleted')}</td><td>${esc(t?.title||'Unknown')}</td><td>${new Date(s.date).toLocaleDateString()}</td><td>${pill(s.status)}</td><td>${s.score===null?'—':s.score+'/'+s.maxScore}${s.band!==null?' (Band '+s.band+')':''}</td>${admin?`<td><button class="btn secondary tiny" onclick="grade('${s.id}')">${s.status==='Completed'?'Review':'Grade'}</button></td>`:''}</tr>`}).join('')}</table></div>`}function gradingPage(){let a=db.submissions.slice().reverse();document.getElementById('content').innerHTML=`<div class="head"><div><h1>Marking & Scores</h1><p class="muted">Review written responses, watch speaking videos and assign scores.</p></div></div><div class="card">${a.length?tableSub(a,true):'<div class="empty">No submissions to mark.</div>'}</div>`}function grade(id){let s=db.submissions.find(x=>x.id===id),t=byId(s.testId),u=db.users.find(x=>x.id===s.userId),obj=['Listening','Reading'].includes(t.cat);showModal(`<h2>Assess submission</h2><p><b>${esc(u?.name)}</b> · ${esc(t.title)}</p><p>${pill(s.status)}</p>${obj?`<div class="notice">Auto-marked score: ${s.score}/${s.maxScore}</div>`:t.cat==='Speaking'?`<p>Video file: ${esc(s.response)}</p><button class="btn secondary" onclick="playVideo('${s.id}')">▶ Watch recorded answer</button>`:`<div class="card" style="white-space:pre-wrap;max-height:260px;overflow:auto">${esc(s.response)}</div>`}<form onsubmit="saveGrade(event,'${id}')"><label class="field">Score (0–9 IELTS band, half-band increments)<select name="band">${Array.from({length:19},(_,i)=>i/2).map(n=>`<option value="${n}" ${s.band===n?'selected':''}>${n.toFixed(1)}</option>`).join('')}</select></label><label class="field">Instructor feedback<textarea name="feedback">${esc(s.feedback)}</textarea></label><div class="row spread"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn">Save assessment</button></div></form><p class="small muted">Scores are instructor-entered practice bands, not official IELTS results.</p>`)}function saveGrade(e,id){e.preventDefault();let s=db.submissions.find(x=>x.id===id);s.band=Number(e.target.band.value);s.feedback=e.target.feedback.value;s.status='Completed';if(s.score===null){s.score=s.band;s.maxScore=9}save();closeModal();render()}function viewResult(id){let s=sub(current.id,id);showModal(`<h2>${esc(byId(id).title)}</h2><p>${pill(s.status)}</p><p><b>Score:</b> ${s.score===null?'Awaiting marking':s.score+'/'+s.maxScore}</p><p><b>Estimated practice band:</b> ${s.band??'Not assigned'}</p><p><b>Feedback:</b> ${esc(s.feedback||'No feedback yet')}</p><button class="btn secondary" onclick="closeModal()">Close</button>`)}function reportsPage(){let a=current.role==='admin'?db.submissions:subs(current.id);document.getElementById('content').innerHTML=`<div class="head"><div><h1>${current.role==='admin'?'Progress reports':'My results'}</h1><p class="muted">Completed submissions and instructor feedback.</p></div>${current.role==='admin'?'<button class="btn" onclick="exportCSV()">Export CSV</button>':''}</div><div class="card">${a.length?tableSub(a.slice().reverse(),current.role==='admin'):'<div class="empty">No results yet.</div>'}</div>`}function exportCSV(){let rows=[['Trainee','Username','Group','Section','Test','Date','Status','Score','Maximum','Band','Feedback'],...db.submissions.map(s=>{let u=db.users.find(x=>x.id===s.userId),t=byId(s.testId);return [u?.name,u?.username,u?.group,t?.cat,t?.title,s.date,s.status,s.score,s.maxScore,s.band,s.feedback]})],csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ashraf-ielts-results.csv';a.click();URL.revokeObjectURL(a.href)}function showModal(html){let el=document.createElement('div');el.id='modal';el.className='modalbg';el.onclick=e=>{if(e.target===el)closeModal()};el.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(el)}function closeModal(){document.getElementById('modal')?.remove()}login();
</script></body></html>
